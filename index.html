.logo-marca,.logo-texto{background-size:contain;background-repeat:no-repeat;background-position:center;display:inline-block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0B1C; --card:#191433; --sunk:#201A42;
  --ink:#F1EEFF; --label:#F1EEFF; --label2:#9D97C4; --label3:#6B6590;
  --line:#2A2350; --sep:#2A2350; --fill:#262050;
  --brand-2:#A683FF;
  --chrome:rgba(25,20,51,.86);
  --shadow:0 4px 20px -10px rgba(0,0,0,.65);
  --shadow-lg:0 18px 44px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0E0B1C; --card:#191433; --sunk:#201A42;
  --ink:#F1EEFF; --label:#F1EEFF; --label2:#9D97C4; --label3:#6B6590;
  --line:#2A2350; --sep:#2A2350; --fill:#262050;
  --brand-2:#A683FF;
  --chrome:rgba(25,20,51,.86);
  --shadow:0 4px 20px -10px rgba(0,0,0,.65);
  --shadow-lg:0 18px 44px -18px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:3px;border-radius:12px}

/* ---------- shell ---------- */
#hdr{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(50px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--chrome);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid transparent;opacity:0;transition:opacity .22s ease,border-color .22s;pointer-events:none}
#hdr.show{opacity:1;border-bottom-color:var(--line);pointer-events:auto}
#hdr b{font-size:16px;font-weight:700;letter-spacing:-.025em}
.hdr-mk{width:19px;height:17px;opacity:.95}
.mark-logo{width:76px;height:67px;display:block;margin:0 auto 26px}
#scroll::before{content:"";position:fixed;top:0;left:0;right:0;height:260px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(107,59,240,.13),rgba(107,59,240,.045) 45%,transparent)}
.app{position:relative;z-index:1}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.app{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 6px) 18px calc(112px + env(safe-area-inset-bottom,0px))}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page{animation:pop .3s cubic-bezier(.22,.7,.3,1)}
@media (prefers-reduced-motion:reduce){.page{animation:none}}

/* ---------- cabecera de vista ---------- */
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 18px}
.title{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.12;margin:0}
.title small{display:block;font-size:13px;font-weight:500;color:var(--label2);letter-spacing:-.01em;margin-top:4px}
.round{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;
  color:var(--indigo);flex:0 0 auto;box-shadow:var(--shadow);transition:transform .14s}
.round:active{transform:scale(.92)}
.round svg{width:19px;height:19px}
.round.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

h2.sec{font-size:16px;font-weight:700;letter-spacing:-.025em;color:var(--ink);
  margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h2.sec button,h2.sec span{font-size:12.5px;font-weight:600;color:var(--indigo);letter-spacing:-.01em}
h2.sec button:active{opacity:.55}

/* ---------- tarjeta de saldo ---------- */
.balance{border-radius:30px;padding:24px 22px 22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(152deg,var(--indigo-2) 0%,var(--indigo) 48%,var(--indigo-3) 100%);
  box-shadow:0 16px 36px -14px rgba(66,74,212,.55)}
.balance::after{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.26),rgba(255,255,255,0) 68%)}
.balance .lbl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:rgba(255,255,255,.78);margin:0}
.balance .lbl b::first-letter{text-transform:uppercase}
.balance .lbl b{display:inline-block;font-weight:600;color:#fff;background:rgba(255,255,255,.17);padding:3px 9px;border-radius:999px;font-size:11.5px}
.balance .amt{margin:9px 0 0;font-size:clamp(34px,10.5vw,42px);font-weight:800;letter-spacing:-.045em;line-height:1.04}
.balance .amt span{font-size:.56em;font-weight:600;opacity:.82}
.balance .sub{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:5px;font-weight:500}
.balance .falta{display:flex;align-items:center;gap:7px;margin:11px 0 0;padding:8px 11px;border-radius:13px;
  background:rgba(255,255,255,.15);font-size:12.5px;font-weight:500;color:rgba(255,255,255,.92)}
.balance .falta svg{width:15px;height:15px;flex:0 0 auto;opacity:.9}
.balance .falta b{font-weight:750}
.balance .falta.ok{background:rgba(255,255,255,.1);color:rgba(255,255,255,.78)}
.split{display:flex;gap:10px;margin-top:20px;position:relative}
.split div{flex:1;background:rgba(255,255,255,.15);border-radius:17px;padding:11px 13px;min-width:0}
.split span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:rgba(255,255,255,.82);font-weight:500}
.split span svg{width:12px;height:12px;flex:0 0 auto}
.split b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.03em;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- accesos circulares ---------- */
.quick{display:flex;justify-content:space-between;gap:6px;margin:20px 2px 0}
.quick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.quick .ic{width:54px;height:54px;border-radius:19px;display:grid;place-items:center;color:#fff;
  box-shadow:0 7px 16px -8px rgba(19,22,48,.45);transition:transform .16s}
.quick button:active .ic{transform:scale(.9)}
.quick .ic svg{width:22px;height:22px}
.quick em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--label2);letter-spacing:-.01em;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- tarjetas y grupos ---------- */
.group,.widget{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.group{overflow:hidden}
.group+.group{margin-top:14px}
.widget{padding:20px;margin-top:14px}
.widget:first-child{margin-top:0}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--label2);font-size:13px;font-weight:600}
.money{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.045em;line-height:1.06;margin:8px 0 0}
.money.neg{color:var(--red)}
.money.mid{font-size:27px;letter-spacing:-.035em}
.sub{font-size:13px;color:var(--label2);margin-top:6px;line-height:1.38;font-weight:500}
.pair{display:flex;gap:10px;margin-top:16px}
.pair div{flex:1;background:var(--sunk);border-radius:16px;padding:11px 13px;min-width:0}
.pair span{display:block;font-size:11.5px;color:var(--label2);font-weight:600}
.pair b{display:block;font-size:16px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.pair b.in{color:var(--green)}
.band{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:16px;background:var(--fill);gap:2px}
.band span{transition:width .4s cubic-bezier(.32,.72,0,1);border-radius:2px}

/* medidor */
.gauge{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.gauge svg{width:186px;height:104px;display:block}
.gauge .val{margin:-32px 0 0;font-size:29px;font-weight:800;letter-spacing:-.045em}
.gauge .cap{font-size:12.5px;color:var(--label2);font-weight:500;margin:2px 0 0;text-align:center}
.legend{display:flex;gap:10px;margin-top:16px;width:100%}
.legend div{flex:1;background:var(--sunk);border-radius:16px;padding:11px 13px;text-align:center;min-width:0}
.legend span{display:block;font-size:11.5px;color:var(--label2);font-weight:600;margin-bottom:2px}
.legend b{font-size:15px;font-weight:700;letter-spacing:-.03em}

/* ---------- celdas ---------- */
.cell{display:flex;align-items:center;gap:13px;width:100%;padding:13px 17px;text-align:left;
  position:relative;background:none;transition:background .12s}
button.cell:active{background:var(--sunk)}
.cell+.cell::before,.cell+.ded::before,.ded+.cell::before,.ded+.ded::before{
  content:"";position:absolute;left:17px;right:0;top:0;height:1px;background:var(--line)}
.cell .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.cell .ic svg{width:18px;height:18px}
.cell .tx{flex:1;min-width:0}
.cell .tx b{display:block;font-weight:600;font-size:14.5px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .tx span{display:block;font-size:12px;color:var(--label2);font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .val{font-size:14.5px;font-weight:700;letter-spacing:-.03em;text-align:right;white-space:nowrap;flex:0 0 auto}
.cell .val.in{color:var(--green)}
.cell .val small{display:block;font-size:11.5px;font-weight:600;color:var(--label3);margin-top:1px}
.cell label{flex:1;font-size:14.5px;font-weight:600;letter-spacing:-.015em}
.cell label em{display:block;font-style:normal;font-size:12px;color:var(--label2);font-weight:500;margin-top:2px;line-height:1.35}
.cell.off .tx b,.cell.off .val{color:var(--label3);text-decoration:line-through}
.cell.compact{padding:11px 17px}
.cell.compact .ic{width:34px;height:34px;border-radius:12px}
.cell.compact .ic svg{width:15px;height:15px}
.cell[aria-pressed="true"]{background:var(--sunk)}
.dot{width:40px;height:40px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;color:#fff}
.dot svg{width:19px;height:19px}
.cell.compact .dot{width:34px;height:34px;border-radius:12px}
.cell.compact .dot svg{width:16px;height:16px}
.meter{display:block;height:5px;border-radius:3px;background:var(--fill);margin-top:7px;width:100%;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;transition:width .4s cubic-bezier(.32,.72,0,1)}
.chev{color:var(--label3);flex:0 0 auto}
.day{font-size:12.5px;color:var(--label2);font-weight:600;margin:18px 6px 8px}
.day::first-letter,.cap1::first-letter{text-transform:uppercase}
.cap1{display:inline-block}

/* ---------- mosaicos ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.tile{background:var(--card);border-radius:21px;padding:15px;text-align:left;display:block;
  box-shadow:var(--shadow);transition:transform .14s}
.tile:active{transform:scale(.96)}
.tile .ic{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:11px}
.tile .ic svg{width:17px;height:17px}
.tile .lab{font-size:12px;color:var(--label2);font-weight:600}
.tile .big{font-size:19px;font-weight:800;letter-spacing:-.04em;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .delta{font-size:11.5px;color:var(--label2);font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .delta.up{color:var(--red)}
.tile .delta.down{color:var(--green)}

.hero-min{padding:2px 4px 16px}
.hero-min .k{font-size:13px;color:var(--label2);font-weight:600}
.hero-min .v{font-size:40px;font-weight:800;letter-spacing:-.05em;line-height:1.05;margin-top:3px}
.hero-min .v.neg{color:var(--red)}
.hero-min .s{font-size:13px;color:var(--label2);margin-top:4px;font-weight:500}

/* ---------- controles ---------- */
.strip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:var(--card);border-radius:999px;padding:8px 15px;font-size:13.5px;
  font-weight:600;color:var(--label2);box-shadow:var(--shadow);transition:transform .12s}
.pill:active{transform:scale(.94)}
.pill[aria-pressed="true"]{background:var(--indigo);color:#fff;box-shadow:0 6px 14px -6px rgba(90,99,236,.6)}
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:11px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--label2);transition:all .18s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px -2px rgba(19,22,48,.14)}

input[type=text],input[type=number],input[type=date],select{padding:9px 12px;border:1px solid var(--line);
  border-radius:13px;background:var(--sunk);max-width:150px;text-align:right;font-size:15.5px;font-weight:600;appearance:none}
input[type=date]{text-align:left}
select{text-align:left;padding-right:28px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='%23767B9B' d='M6 8.5 2.5 5h7z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:11px}
.pct{max-width:82px}
.hero-input{width:100%;max-width:none;text-align:left;font-size:30px;font-weight:800;letter-spacing:-.04em;padding:13px 15px;border-radius:17px}
.search{width:100%;max-width:none;text-align:left;margin:0 0 12px;padding:12px 15px;font-size:15px;font-weight:500;border-radius:16px;background:var(--card);border-color:transparent;box-shadow:var(--shadow)}
input[type=checkbox]{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--fill);
  position:relative;transition:background .25s cubic-bezier(.32,.72,0,1);flex:0 0 auto;border:0}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(19,22,48,.2);transition:transform .25s cubic-bezier(.32,.72,0,1)}
input[type=checkbox]:checked{background:var(--indigo)}
input[type=checkbox]:checked::after{transform:translateX(20px)}

.btn{background:var(--indigo);color:#fff;border-radius:16px;padding:13px 20px;font-size:15.5px;font-weight:700;
  letter-spacing:-.015em;transition:transform .12s,opacity .12s;box-shadow:0 8px 18px -8px rgba(90,99,236,.7)}
.btn:active{transform:scale(.97);opacity:.9}
.btn.quiet{background:var(--sunk);color:var(--indigo);box-shadow:none}
.btn.destruct{background:var(--sunk);color:var(--red);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:12px}
.btn[disabled]{opacity:.45}

.ded{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 17px;position:relative}
.ded input[type=text]{text-align:left;max-width:none}
.ded .x{background:var(--sunk);border-radius:12px;width:36px;height:36px;color:var(--red);font-size:19px;line-height:1}

.note{font-size:12.5px;color:var(--label2);margin:10px 6px 0;line-height:1.45;font-weight:500}
.blank{background:var(--card);border-radius:var(--r);padding:30px 22px;text-align:center;box-shadow:var(--shadow)}
.blank p{color:var(--label2);font-size:14.5px;margin:0 0 18px;line-height:1.45;font-weight:500}
.chart{width:100%;display:block;margin-top:12px;overflow:visible}

/* hallazgos */
.find{background:var(--card);border-radius:22px;padding:17px;margin-top:12px;box-shadow:var(--shadow)}
.find .hd{display:flex;align-items:center;gap:12px}
.find .hd .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.find .hd .ic svg{width:17px;height:17px}
.find .hd b{font-size:15.5px;font-weight:700;letter-spacing:-.02em;flex:1}
.find .hd .amt{font-size:16px;font-weight:800;letter-spacing:-.035em}
.find .l1{font-size:13.5px;color:var(--label2);margin-top:9px;line-height:1.4;font-weight:500}
.find .l2{font-size:13px;margin-top:4px;font-weight:600}
.find ul{list-style:none;margin:13px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.find li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;font-weight:600}
.find li span{color:var(--label2);font-size:12px;font-weight:500}
.find li .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* avisos */
.toast{margin:0 0 14px;padding:14px 16px;border-radius:18px;background:var(--card);font-size:14px;
  color:var(--label2);font-weight:500;box-shadow:var(--shadow);animation:pop .22s}
.toast.err{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--ink)}
.bar{height:4px;background:var(--fill);border-radius:2px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);width:0;transition:width .3s}

/* ---------- barra inferior ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  padding:0 18px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs ul{display:flex;align-items:center;gap:3px;background:var(--chrome);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-radius:24px;padding:7px;margin:0;list-style:none;width:100%;max-width:404px;pointer-events:auto;
  box-shadow:0 12px 34px -12px rgba(26,21,80,.3);border:1px solid rgba(255,255,255,.5)}
nav.tabs li{flex:1;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;
  border-radius:17px;color:var(--label3);font-size:10px;font-weight:700;letter-spacing:-.01em;transition:all .2s}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-current="page"]{background:linear-gradient(150deg,var(--brand-2),var(--brand-3));color:#fff;
  box-shadow:0 7px 16px -6px rgba(107,59,240,.7)}
nav.tabs button:not([aria-current="page"]):active{background:var(--fill)}

/* ---------- hojas ---------- */
dialog{border:0;border-radius:28px;padding:0;width:calc(100% - 16px);max-width:440px;margin:auto auto 8px;
  background:var(--bg);color:var(--ink);max-height:90vh;overflow:hidden}
dialog::backdrop{background:rgba(10,12,26,.5);animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
dialog[open]{animation:up .34s cubic-bezier(.32,.72,0,1)}
dialog.closing{animation:down .25s cubic-bezier(.32,.72,0,1) forwards}
@keyframes down{to{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){dialog[open],dialog.closing{animation:none}}
.sheet{padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:90vh}
.grab{width:38px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 14px;touch-action:none}
.sheet h3{font-size:19px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px;text-align:center}
.sheet .sm{color:var(--label2);font-size:13.5px;margin:0 0 16px;text-align:center;line-height:1.42;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border-radius:15px;padding:12px 13px;background:var(--card);display:flex;gap:9px;align-items:center;
  font-size:14px;font-weight:600;text-align:left;transition:transform .12s;box-shadow:var(--shadow)}
.opt:active{transform:scale(.96)}
.opt i{width:11px;height:11px;border-radius:4px;flex:0 0 auto}
.opt[aria-pressed="true"]{background:var(--indigo);color:#fff}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1}

input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* ---------- cuestionario ---------- */
nav.tabs[hidden]{display:none}
.wiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 12px}
.wiz-top .paso{font-size:12.5px;font-weight:700;color:var(--label2);letter-spacing:-.01em}
.wiz-top button{font-size:13px;font-weight:600;color:var(--label2);padding:4px}
.prog{display:flex;gap:5px;padding:0 4px 22px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--fill);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--indigo-2),var(--indigo));transition:width .55s cubic-bezier(.3,.85,.3,1)}
.prog i.on::after{width:100%}
.prog i.now::after{width:100%;animation:latir 1.9s ease-in-out infinite}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.prog i.now::after{animation:none}}
.wiz h1{font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1.2;margin:0 4px 7px}
.wiz .intro{font-size:14.5px;color:var(--label2);line-height:1.5;margin:0 4px 20px;font-weight:500}

/* bienvenida */
.hola{text-align:center;padding:26px 8px 0}
.hola .mark{width:86px;height:86px;border-radius:29px;margin:0 auto 24px;display:grid;place-items:center;
  background:linear-gradient(152deg,var(--indigo-2),var(--indigo-3));box-shadow:0 18px 34px -16px rgba(66,74,212,.7)}
.hola .mark svg{width:40px;height:40px;color:#fff}
.hola h1{font-size:29px;font-weight:800;letter-spacing:-.042em;margin:0 0 12px;line-height:1.16}
.hola>p{font-size:15px;color:var(--label2);line-height:1.55;margin:0 auto;max-width:31em;font-weight:500}
.puntos{text-align:left;margin:26px auto 0;max-width:31em}
.puntos div{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.puntos .n{width:30px;height:30px;border-radius:11px;background:var(--sunk);color:var(--indigo);display:grid;place-items:center;flex:0 0 auto}
.puntos .n svg{width:15px;height:15px}
.puntos p{margin:3px 0 0;font-size:13.5px;color:var(--label2);line-height:1.45;font-weight:500}
.puntos b{color:var(--ink);font-weight:700}

/* personas */
.person{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:12px 17px;position:relative}
.person+.person::before,.cell+.person::before,.person+.cell::before{content:"";position:absolute;left:17px;right:0;top:0;height:1px;background:var(--line)}
.person .av{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:0 0 auto}
.person .av svg{width:18px;height:18px}
.person input{text-align:left;max-width:none;width:100%}
.person .x{background:var(--sunk);border-radius:12px;width:36px;height:36px;color:var(--red);font-size:19px;line-height:1;flex:0 0 auto}

/* fuentes de ingreso */
.src{background:var(--card);border-radius:20px;padding:15px 15px 6px;margin-top:11px;box-shadow:var(--shadow)}
.src .fila{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.src .fila input[type=text]{flex:1;max-width:none;text-align:left}
.src .campo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0}
.src .campo+.campo{border-top:1px solid var(--line)}
.src .campo>label{font-size:13.5px;font-weight:600;flex:1;letter-spacing:-.01em}
.src .campo>label em{display:block;font-style:normal;font-size:11.5px;color:var(--label2);font-weight:500;margin-top:2px;line-height:1.35}
.src .campo.col{display:block}
.src .campo.col>label{margin-bottom:9px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--sunk);border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--label2);transition:all .16s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--indigo);color:#fff}

/* metas */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.goal{background:var(--card);border-radius:21px;padding:19px 14px;text-align:center;box-shadow:var(--shadow);transition:transform .14s,box-shadow .2s}
.goal:active{transform:scale(.95)}
.goal .ic{width:50px;height:50px;border-radius:18px;margin:0 auto 11px;display:grid;place-items:center;color:#fff}
.goal .ic svg{width:23px;height:23px}
.goal b{display:block;font-size:14px;font-weight:700;letter-spacing:-.022em}
.goal em{display:block;font-style:normal;font-size:11.5px;color:var(--label2);font-weight:500;margin-top:2px}
.goal[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--indigo),var(--shadow)}
.goal.wide{grid-column:1/3;display:flex;align-items:center;gap:13px;text-align:left;padding:15px}
.goal.wide .ic{margin:0;width:44px;height:44px;border-radius:16px}

/* correo */
.privacidad{background:var(--sunk);border-radius:20px;padding:16px;margin-top:14px}
.privacidad .t{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:-.02em}
.privacidad .t svg{width:19px;height:19px;color:var(--green);flex:0 0 auto}
.privacidad p{margin:9px 0 0;font-size:13px;color:var(--label2);line-height:1.5;font-weight:500}
.pasos3{margin-top:14px}
.pasos3 div{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.pasos3 .n{width:26px;height:26px;border-radius:9px;background:var(--indigo);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:800;flex:0 0 auto}
.pasos3 p{margin:2px 0 0;font-size:13.5px;color:var(--label2);line-height:1.45;font-weight:500}
.pasos3 b{color:var(--ink);font-weight:700}

/* ---------- cómo funciona ---------- */
.intro-wrap{display:flex;flex-direction:column;min-height:72vh}
.intro-art{height:184px;border-radius:26px;display:grid;place-items:center;margin:4px 0 26px;position:relative;overflow:hidden}
.intro-art svg{width:74px;height:74px;color:#fff;position:relative;z-index:1}
.intro-art::after{content:"";position:absolute;width:150%;height:150%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 62%);top:-40%;left:-25%}
.intro-wrap h2{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.18;margin:0 2px 11px}
.intro-wrap>p{font-size:15px;line-height:1.56;color:var(--label2);margin:0 2px;font-weight:500}
.intro-wrap .lista{margin:18px 2px 0;display:grid;gap:11px}
.intro-wrap .lista div{display:flex;gap:10px;align-items:flex-start}
.intro-wrap .lista svg{width:17px;height:17px;color:var(--green);flex:0 0 auto;margin-top:2px}
.intro-wrap .lista p{margin:0;font-size:13.5px;line-height:1.45;color:var(--label2);font-weight:500}
.intro-dots{display:flex;gap:7px;justify-content:center;padding:26px 0 16px}
.intro-dots i{width:7px;height:7px;border-radius:50%;background:var(--fill);transition:all .3s}
.intro-dots i.on{background:var(--indigo);width:21px;border-radius:4px}

/* ---------- monto con moneda ---------- */
.mon{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.mon input{max-width:116px}
.chips.sw{gap:4px}
.chips.sw .chip{padding:7px 10px;font-size:12px;min-width:32px;text-align:center}

/* ---------- persona: aporta / no aporta ---------- */
.person .rol{grid-column:2/4;display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.person .rol .chip{padding:6px 11px;font-size:11.5px}

/* ---------- metas ---------- */
.meta-fila{display:flex;align-items:center;gap:11px;padding:13px 15px;position:relative}
.meta-fila+.meta-fila::before{content:"";position:absolute;left:15px;right:0;top:0;height:1px;background:var(--line)}
.meta-fila .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.meta-fila .ic svg{width:19px;height:19px}
.meta-fila .nm{flex:1;min-width:0}
.meta-fila .nm b{display:block;font-size:14px;font-weight:700;letter-spacing:-.022em}
.meta-fila .nm span{font-size:11.5px;color:var(--label2);font-weight:500}

/* ---------- nota destacada ---------- */
.tip{display:flex;gap:11px;align-items:flex-start;background:linear-gradient(135deg,rgba(90,99,236,.09),rgba(90,99,236,.04));
  border-radius:18px;padding:14px 15px;margin-top:13px}
.tip svg{width:18px;height:18px;color:var(--indigo);flex:0 0 auto;margin-top:1px}
.tip p{margin:0;font-size:13px;line-height:1.5;color:var(--label2);font-weight:500}
.tip b{color:var(--indigo);font-weight:700}

/* ---------- tour ---------- */
#tour{position:fixed;inset:0;z-index:300}
#tour[hidden]{display:none}
#tour .foco{position:absolute;border-radius:18px;box-shadow:0 0 0 9999px rgba(18,12,52,.68);
  outline:2.5px solid rgba(255,255,255,.92);outline-offset:3px;pointer-events:none;
  transition:left .34s cubic-bezier(.3,.85,.3,1),top .34s cubic-bezier(.3,.85,.3,1),width .34s,height .34s;
  animation:focoin .3s ease}
@keyframes focoin{from{opacity:0}to{opacity:1}}
#tour .globo{position:absolute;left:16px;right:16px;background:var(--card);border-radius:20px;padding:16px 17px;
  box-shadow:0 22px 50px -14px rgba(14,16,40,.5);animation:globoin .34s cubic-bezier(.25,1.1,.4,1)}
@keyframes globoin{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}
#tour .globo.arriba{transform:translateY(-100%)}
#tour .globo b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.028em;margin-bottom:6px}
#tour .globo p{margin:0;font-size:13.5px;line-height:1.5;color:var(--label2);font-weight:500}
#tour .globo .tap{display:block;margin-top:12px;font-size:11.5px;color:var(--indigo);font-weight:700}
#tour .globo .pico{position:absolute;width:15px;height:15px;background:var(--card);transform:rotate(45deg);border-radius:4px;
  top:-7px;margin-left:-7px}
#tour .globo.arriba .pico{top:auto;bottom:-7px}
@media (prefers-reduced-motion:reduce){#tour .foco,#tour .globo,#tour .velo{animation:none;transition:none}}

/* ---------- preguntale a pacci ---------- */
.ask{width:100%;display:flex;align-items:center;gap:12px;margin:18px 0 0;padding:15px 17px;border-radius:22px;
  background:linear-gradient(118deg,var(--brand-3),var(--brand) 55%,var(--brand-2));
  box-shadow:0 12px 26px -14px rgba(107,59,240,.85);color:#fff;text-align:left;position:relative;overflow:hidden;
  transition:transform .16s}
.ask:active{transform:scale(.985)}
.ask::after{content:"";position:absolute;right:-48px;top:-58px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%)}
.ask .bola{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:0 0 auto}
.ask .bola svg{width:21px;height:21px}
.ask .tx{flex:1;min-width:0;position:relative;z-index:1}
.ask .tx b{display:block;font-size:14.5px;font-weight:750;letter-spacing:-.025em}
.ask .tx span{display:block;font-size:12px;color:rgba(255,255,255,.8);font-weight:500;margin-top:1px}
.ask .fl{opacity:.75;flex:0 0 auto}
.ask .fl svg{width:17px;height:17px}

.chat-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px 4px}
.lnk{color:var(--brand);font-size:13px;font-weight:700}
.chat-cuerpo{min-height:46vh;max-height:52vh;overflow-y:auto;padding:12px 2px;display:flex;flex-direction:column;gap:13px}
.burb{display:flex;gap:9px;align-items:flex-start;max-width:100%}
.burb.yo{justify-content:flex-end}
.burb .txt{font-size:14.5px;line-height:1.5;font-weight:500;border-radius:19px;padding:11px 14px;max-width:84%}
.burb.yo .txt{background:linear-gradient(145deg,var(--brand-2),var(--brand));color:#fff;border-bottom-right-radius:7px}
.burb.pacci .txt{background:var(--sunk);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:7px}
.chat-mk{width:25px;height:22px;flex:0 0 auto;margin-top:5px}
.puntitos{display:inline-flex;gap:4px;margin-left:3px;vertical-align:middle}
.puntitos i{width:5px;height:5px;border-radius:50%;background:var(--label3);animation:salta 1.1s infinite}
.puntitos i:nth-child(2){animation-delay:.16s}
.puntitos i:nth-child(3){animation-delay:.32s}
@keyframes salta{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat-vacio{text-align:center;padding:14px 8px 4px}
.chat-vacio .logo-marca{width:46px;height:41px;margin-bottom:12px}
.chat-vacio b{display:block;font-size:19px;font-weight:800;letter-spacing:-.035em}
.chat-vacio p{margin:0 auto;max-width:300px;font-size:13.5px;line-height:1.5;color:var(--label2);font-weight:500}
.sug{display:grid;gap:8px;margin-top:20px}
.sug button{background:var(--sunk);border:1px solid var(--line);border-radius:15px;padding:12px 14px;
  font-size:13.5px;font-weight:600;color:var(--ink);text-align:left;letter-spacing:-.015em;transition:all .16s}
.sug button:active{background:var(--fill);transform:scale(.985)}
.chat-pie{display:flex;align-items:flex-end;gap:9px;padding:12px 0 2px;border-top:1px solid var(--line);margin-top:4px}
.chat-pie textarea{flex:1;background:var(--sunk);border:1px solid var(--line);border-radius:19px;padding:11px 15px;
  font-size:15px;font-weight:500;resize:none;max-height:120px;line-height:1.45;color:var(--ink)}
.chat-pie textarea:focus{outline:none;border-color:var(--brand-2)}
.chat-pie .env{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--brand-2),var(--brand-3));box-shadow:0 6px 14px -6px rgba(107,59,240,.7)}
.chat-pie .env svg{width:19px;height:19px;margin-left:-2px}
.chat-pie .env:active{transform:scale(.92)}

/* ---------- aviso contextual ---------- */
.aviso{border-radius:19px;padding:14px 16px;margin:0 2px 14px}
.aviso b{display:block;font-size:14.5px;font-weight:750;letter-spacing:-.025em;margin-bottom:5px}
.aviso p{margin:0;font-size:13px;line-height:1.5;font-weight:500}
.aviso.alerta{background:rgba(240,86,74,.1)}
.aviso.alerta b{color:#D4402F}
.aviso.alerta p{color:var(--label2)}
.aviso.bien{background:rgba(23,181,131,.11)}
.aviso.bien b{color:#0E8C65}
.aviso.bien p{color:var(--label2)}
.aviso.info{background:rgba(107,59,240,.09)}
.aviso.info b{color:var(--brand-3)}
.aviso.info p{color:var(--label2)}

/* ---------- metas ---------- */
.meta-card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:11px;
  animation:metain .32s cubic-bezier(.25,1.05,.4,1)}
@keyframes metain{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.meta-card{animation:none}}
.mc-top{display:flex;align-items:center;gap:12px;padding:14px 15px 13px}
.mc-top .ic{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.mc-top .ic svg{width:20px;height:20px}
.mc-top .nm{flex:1;min-width:0}
.mc-top .nm b{display:block;font-size:15px;font-weight:750;letter-spacing:-.028em}
.mc-top .nm span{font-size:12px;color:var(--label2);font-weight:500}
.mc-top .x{width:30px;height:30px;border-radius:50%;color:var(--label3);font-size:19px;line-height:1;flex:0 0 auto}
.mc-top .x:active{background:var(--fill)}
.mc-monto{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px 14px;
  border-top:1px solid var(--line);background:var(--sunk)}
.mc-monto label{font-size:13px;font-weight:600;color:var(--label2);letter-spacing:-.015em}
.mc-monto input{max-width:112px;text-align:right}
.mc-total{display:flex;align-items:center;justify-content:space-between;padding:14px 17px;margin-top:3px;
  background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.mc-total span{font-size:13px;font-weight:600;color:var(--label2)}
.mc-total b{font-size:17px;font-weight:800;letter-spacing:-.035em}
.mini{font-size:12px;font-weight:700;color:var(--label3);letter-spacing:.02em;text-transform:uppercase;margin:18px 6px 11px}

/* ================= CÓMO FUNCIONA ================= */
#introlay{position:fixed;inset:0;z-index:60}
#introlay[hidden]{display:none}
body.con-intro #scroll{overflow:hidden}
.comofunciona{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 18px);
  max-width:440px;margin:0 auto}
.intro-tinte{position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 50% -8%,var(--tinte),transparent 62%);
  transition:background .7s ease}
.intro-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:18px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  color:var(--label3);background:var(--card);box-shadow:var(--shadow);z-index:4}
.intro-x svg{width:15px;height:15px}

/* ---- lienzo ---- */
.intro-lienzo{flex:0 1 auto;height:min(300px,38dvh);margin:46px 0 0;border-radius:32px;position:relative;overflow:hidden;
  background:linear-gradient(155deg,var(--c1),var(--c2));
  box-shadow:0 26px 54px -26px color-mix(in srgb,var(--c2) 72%,transparent);
  animation:lienzoIn .62s cubic-bezier(.22,1.05,.36,1) both}
@keyframes lienzoIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.intro-lienzo::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;top:-140px;right:-110px;
  background:radial-gradient(circle,rgba(255,255,255,.26),transparent 66%)}
.art{position:absolute;inset:0}

/* ---- 1. todo en un lugar ---- */
.a1 .chip{position:absolute;display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:rgba(255,255,255,.95);color:#1A1550;border-radius:13px;padding:8px 12px;
  font-size:11px;font-weight:700;letter-spacing:-.02em;box-shadow:0 8px 18px -8px rgba(14,8,48,.5);max-width:168px;
  animation:chipVuela 3.4s cubic-bezier(.5,0,.2,1) infinite both}
.a1 .chip b{font-weight:800;color:#E0453A}
.a1 .chip b.in{color:#0E8C65}
.a1 .p1{--x:-84px;--y:-76px;--r:-9deg;animation-delay:.05s}
.a1 .p2{--x:78px;--y:-96px;--r:7deg;animation-delay:.16s}
.a1 .p3{--x:-92px;--y:14px;--r:6deg;animation-delay:.27s}
.a1 .p4{--x:86px;--y:22px;--r:-5deg;animation-delay:.38s}
.a1 .p5{--x:-68px;--y:84px;--r:-7deg;animation-delay:.49s}
.a1 .p6{--x:72px;--y:92px;--r:8deg;animation-delay:.6s}
@keyframes chipVuela{
  0%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(.86)}
  14%,46%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1)}
  70%,100%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.5)}
}
.a1 .chip{left:50%;top:50%}
.a1 .nucleo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
  background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);
  border-radius:22px;padding:18px 26px;color:#fff;
  animation:nucleoIn 3.4s cubic-bezier(.3,1.2,.4,1) infinite both;animation-delay:.6s}
@keyframes nucleoIn{0%,55%{opacity:0;transform:translate(-50%,-50%) scale(.8)}
  72%,94%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}
.a1 .nucleo span{display:block;font-size:11px;font-weight:600;opacity:.82;letter-spacing:.01em}
.a1 .nucleo b{display:block;font-size:30px;font-weight:800;letter-spacing:-.045em;margin-top:3px}

/* ---- 2. se alimenta solo ---- */
.a2 .sobre{position:absolute;left:50%;top:24px;width:88px;height:58px;transform:translateX(-50%);
  animation:sobreLate 3.9s ease-in-out infinite}
@keyframes sobreLate{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}
  8%{transform:translateX(-50%) translateY(-5px) scale(1.05)}
  20%{transform:translateX(-50%) translateY(0) scale(1)}
  44%{transform:translateX(-50%) translateY(-5px) scale(1.05)}
  56%{transform:translateX(-50%) translateY(0) scale(1)}
  78%{transform:translateX(-50%) translateY(-5px) scale(1.05)}
  90%{transform:translateX(-50%) translateY(0) scale(1)}}
.a2 .cuerpo{position:absolute;inset:0;border-radius:10px;background:rgba(255,255,255,.97);
  box-shadow:0 12px 24px -10px rgba(4,46,34,.6)}
.a2 .flap{position:absolute;left:7px;right:7px;top:9px;height:26px;
  border-left:3px solid rgba(23,181,131,.38);border-right:3px solid rgba(23,181,131,.38);
  border-radius:2px;transform:skewX(0);
  clip-path:polygon(0 0,100% 0,50% 100%);background:rgba(23,181,131,.14)}
.a2 .sobre::after{content:"";position:absolute;inset:-14px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(255,255,255,.4),transparent 68%);
  animation:halo 3.9s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:0;transform:scale(.8)}10%,46%,80%{opacity:1;transform:scale(1.2)}
  26%,62%,96%{opacity:0;transform:scale(.8)}}
.a2 .mov{position:absolute;left:20px;right:20px;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.98);border-radius:15px;padding:9px 12px;
  box-shadow:0 12px 22px -12px rgba(4,46,34,.55);
  font-size:12.5px;font-weight:700;color:#1A1550;letter-spacing:-.02em;
  animation:movSale 3.9s cubic-bezier(.26,1.12,.4,1) infinite both}
.a2 .mov .ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.a2 .mov .ic svg{width:14px;height:14px}
.a2 .mov .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a2 .mov b{font-weight:800;color:#E0453A}
.a2 .m1{top:104px;animation-delay:.42s}
.a2 .m2{top:156px;animation-delay:1.78s}
.a2 .m3{top:208px;animation-delay:3.14s}
@keyframes movSale{
  0%{opacity:0;transform:translateY(-72px) scale(.6)}
  13%{opacity:1;transform:translateY(0) scale(1)}
  17%{transform:translateY(0) scale(1.03)}
  21%,92%{transform:translateY(0) scale(1)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* ---- 3. ve lo que vos no ves ---- */
.a3 .granos{position:absolute;inset:0;padding:34px 30px 100px;display:flex;flex-wrap:wrap;gap:14px 15px;
  align-content:center;justify-content:center}
.a3 .granos i{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.42);
  animation:granoCae 3.8s cubic-bezier(.3,1.1,.4,1) infinite both;animation-delay:calc(var(--i)*.045s)}
@keyframes granoCae{0%{opacity:0;transform:translateY(-26px) scale(.4)}
  12%,70%{opacity:1;transform:none}
  78%,100%{opacity:.3;transform:scale(.8)}}
.a3 .granos i:nth-child(3n+1){background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.9);
  animation:granoBrilla 3.8s cubic-bezier(.3,1.1,.4,1) infinite both}
@keyframes granoBrilla{0%{opacity:0;transform:translateY(-26px) scale(.4)}
  12%{opacity:1;transform:none}
  52%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.7)}
  64%{transform:scale(1.32);box-shadow:0 0 0 9px rgba(255,255,255,0)}
  72%,100%{opacity:1;transform:scale(1)}}
.a3 .lupa{position:absolute;top:28%;left:-62px;width:88px;height:88px;border-radius:50%;
  border:4px solid rgba(255,255,255,.95);box-shadow:0 0 0 999px rgba(120,70,0,.14) inset,0 10px 26px -10px rgba(90,52,0,.5);
  animation:lupaPasa 3.8s cubic-bezier(.45,0,.3,1) infinite both}
.a3 .lupa::after{content:"";position:absolute;right:-20px;bottom:-14px;width:28px;height:7px;border-radius:4px;
  background:rgba(255,255,255,.95);transform:rotate(42deg)}
@keyframes lupaPasa{0%,8%{opacity:0;transform:translateX(0)}
  16%{opacity:1}
  58%{opacity:1;transform:translateX(300px)}
  66%,100%{opacity:0;transform:translateX(340px)}}
.a3 .hallazgo{position:absolute;left:24px;right:24px;bottom:26px;text-align:center;
  background:rgba(255,255,255,.96);border-radius:19px;padding:13px 16px;color:#1A1550;
  box-shadow:0 14px 30px -14px rgba(90,52,0,.6);
  animation:hallazgoPop 3.8s cubic-bezier(.3,1.3,.4,1) infinite both}
@keyframes hallazgoPop{0%,60%{opacity:0;transform:translateY(14px) scale(.9)}
  72%,92%{opacity:1;transform:none}100%{opacity:0;transform:scale(.97)}}
.a3 .hallazgo b{display:block;font-size:25px;font-weight:800;letter-spacing:-.045em;color:#C97A05}
.a3 .hallazgo span{display:block;font-size:11.5px;font-weight:600;color:var(--label2);margin-top:1px}

/* ---- 4. qué va a pasar ---- */
.a4 svg{position:absolute;inset:0;width:100%;height:100%}
.a4 .plana{fill:none;stroke:rgba(255,255,255,.3);stroke-width:2.5;stroke-dasharray:6 7;stroke-linecap:round}
.a4 .area{fill:url(#iarea);opacity:0;animation:areaSube 4s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes areaSube{0%,14%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.a4 .curva{fill:none;stroke:#fff;stroke-width:5.5;stroke-linecap:round;filter:drop-shadow(0 3px 7px rgba(50,12,120,.4));
  stroke-dasharray:430;stroke-dashoffset:430;animation:traza 4s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes traza{0%{stroke-dashoffset:430}50%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.a4 .punto{position:absolute;width:16px;height:16px;z-index:2;border-radius:50%;background:#fff;
  box-shadow:0 0 0 6px rgba(255,255,255,.28);left:4%;top:81%;
  animation:viaja 4s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes viaja{0%{left:4%;top:81%;opacity:0}6%{opacity:1}
  50%,88%{left:96%;top:12%;opacity:1}100%{left:96%;top:12%;opacity:0}}
.a4 .bandera{position:absolute;left:20px;top:16px;text-align:left;color:#fff;
  background:rgba(255,255,255,.17);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);
  border-radius:15px;padding:9px 13px;
  animation:banderaPop 4s cubic-bezier(.3,1.3,.4,1) infinite both}
@keyframes banderaPop{0%,46%{opacity:0;transform:translateY(8px) scale(.9)}
  58%,88%{opacity:1;transform:none}100%{opacity:0}}
.a4 .bandera b{display:block;font-size:19px;font-weight:800;letter-spacing:-.045em;margin-top:1px}
.a4 .bandera span{display:block;font-size:10.5px;font-weight:700;opacity:.85;letter-spacing:.05em;text-transform:uppercase}
.a4 .piso{position:absolute;left:20px;bottom:14px;color:rgba(255,255,255,.72);font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase}

/* ---- texto y pie ---- */
.intro-texto{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(16px,3dvh,30px) 2px 0;animation:textoIn .62s cubic-bezier(.22,1.05,.36,1) both;animation-delay:.1s}
@keyframes textoIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.intro-texto h2{font-size:29px;font-weight:800;letter-spacing:-.045em;line-height:1.14;margin:0 0 12px}
.intro-texto p{margin:0;font-size:15px;line-height:1.56;color:var(--label2);font-weight:500;max-width:36ch}
.intro-pie{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 2px 0}
.intro-dots{display:flex;gap:7px}
.intro-dots i{width:8px;height:8px;border-radius:50%;background:var(--fill);transition:all .4s cubic-bezier(.3,1.2,.4,1)}
.intro-dots i.ya{background:var(--label3)}
.intro-dots i.on{width:26px;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.intro-next{display:flex;align-items:center;gap:7px;padding:15px 22px;border-radius:999px;color:#fff;
  font-size:15px;font-weight:750;letter-spacing:-.02em;
  background:linear-gradient(140deg,var(--c1),var(--c2));
  box-shadow:0 12px 26px -12px color-mix(in srgb,var(--c2) 85%,transparent);transition:transform .16s}
.intro-next:active{transform:scale(.96)}
.intro-next svg{width:17px;height:17px}

/* ---- el botón que invita a verlo ---- */
.btn-intro{position:relative;width:100%;display:flex;align-items:center;gap:13px;padding:15px 18px;
  border-radius:21px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;text-align:left;
  transition:transform .16s}
.btn-intro:active{transform:scale(.985)}
.btn-intro::before{content:"";position:absolute;inset:-150%;z-index:0;
  background:conic-gradient(from 0deg,transparent 0deg,var(--brand-2) 40deg,var(--brand) 80deg,transparent 140deg,transparent 360deg);
  animation:giro 3.6s linear infinite}
.btn-intro::after{content:"";position:absolute;inset:2px;border-radius:19px;background:var(--card);z-index:0}
.btn-intro>*{position:relative;z-index:1}
@keyframes giro{to{transform:rotate(1turn)}}
.btn-intro .bola{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;color:#fff;
  background:linear-gradient(145deg,var(--brand-2),var(--brand-3))}
.btn-intro .bola svg{width:16px;height:16px;margin-left:2px}
.btn-intro .tx{flex:1;min-width:0}
.btn-intro .tx b{display:block;font-size:14.5px;font-weight:750;letter-spacing:-.025em}
.btn-intro .tx span{display:block;font-size:12px;color:var(--label2);font-weight:500;margin-top:1px}
.btn-intro .fl{color:var(--label3);flex:0 0 auto}
.btn-intro .fl svg{width:16px;height:16px}

@media (prefers-reduced-motion:reduce){
  .intro-lienzo,.intro-texto,.a1 .chip,.a1 .nucleo,.a2 .sobre,.a2 .flap,.a2 .mov,
  .a3 .granos i,.a3 .lupa,.a3 .hallazgo,.a4 .curva,.a4 .punto,.a4 .bandera,.btn-intro::before{animation:none}
  .a1 .chip,.a2 .mov,.a3 .hallazgo,.a4 .bandera{opacity:1;transform:none}
  .a1 .nucleo{opacity:1;transform:translate(-50%,-50%)}
  .a3 .lupa{opacity:1;transform:translateX(130px)}
  .a4 .curva{stroke-dashoffset:0}
  .a4 .punto{left:96%;top:12%;opacity:1}
}

/* ---------- la resta a la vista ---------- */
.resta{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.resta .fil{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 17px;position:relative}
.resta .fil+.fil::before{content:"";position:absolute;left:17px;right:0;top:0;height:1px;background:var(--line)}
.resta .fil span{font-size:13.5px;font-weight:600;color:var(--label2);letter-spacing:-.015em}
.resta .fil b{font-size:15px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.resta .fil.in b{color:var(--green)}
.resta .fil.tot{background:var(--sunk)}
.resta .fil.tot span{color:var(--ink);font-weight:750}
.resta .fil.tot b{font-size:19px;font-weight:800;color:var(--brand)}
.resta .fil.tot::before{height:1.5px;background:var(--ink);opacity:.14}

/* ---------- entrar ---------- */
.login{padding:34px 4px 0;text-align:center;max-width:380px;margin:0 auto}
.login .mark-logo{width:62px;height:55px;margin-bottom:22px}
.login h1{font-size:28px;font-weight:800;letter-spacing:-.045em;margin:0 0 10px}
.login>p{margin:0 auto 26px;font-size:15px;line-height:1.55;color:var(--label2);font-weight:500;max-width:34ch}
.login>p b{color:var(--ink);font-weight:700}
.login input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:17px;
  padding:15px 17px;font-size:16px;font-weight:500;text-align:center;color:var(--ink);box-shadow:var(--shadow)}
.login input:focus{outline:none;border-color:var(--brand-2)}
.login input.codigo{font-size:27px;font-weight:800;letter-spacing:.2em;padding:16px 8px 16px 16px;
  font-variant-numeric:tabular-nums}
.login input::placeholder{color:var(--label3);letter-spacing:normal;font-weight:500}
.login input.codigo::placeholder{letter-spacing:.2em;font-weight:800}
.login-pie{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:17px}
.login-pie button{color:var(--brand);font-size:13.5px;font-weight:700}
.login-pie span{color:var(--label3);font-size:13px}
.login-error{margin:14px auto 0;font-size:13.5px;font-weight:600;color:var(--red);max-width:30ch}
.login-legal{margin:44px auto 0;font-size:12px;line-height:1.5;color:var(--label3);font-weight:500;max-width:30ch}

.splash{min-height:62dvh;display:grid;place-items:center}
.splash .logo-marca{width:58px;height:51px;animation:latido 1.6s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.splash .logo-marca{animation:none;opacity:1}}

function salaryCalc(s){
  const g=Number(s.gross)||0;
  // Fuera de planilla no hay cuota obrera ni retención de renta en la fuente:
  // lo que la persona dice que recibe ya es neto.
  if(s.tipo&&s.tipo!=="planilla"){
    const cus=(s.custom||[]).map(c=>({name:c.name||"Deducción",pre:!!c.pre,amount:dedMonto(c,g)}));
    const ot=cus.reduce((a,b)=>a+b.amount,0);
    return {g,sem:0,ivm:0,bp:0,ccss:0,isr:0,base:g,custom:cus,otros:ot,net:Math.max(0,g-ot)};
  }
  const sem=g*(Number(s.rates.sem)||0)/100,ivm=g*(Number(s.rates.ivm)||0)/100,bp=g*(Number(s.rates.bp)||0)/100;
  const ccss=sem+ivm+bp;
  const custom=(s.custom||[]).map(c=>({name:c.name||"Deducción",pre:!!c.pre,amount:dedMonto(c,g)}));
  const otros=custom.reduce((a,b)=>a+b.amount,0);
  // Lo que sale antes de impuestos baja la base sobre la que se calcula la renta
  const pre=custom.filter(c=>c.pre).reduce((a,b)=>a+b.amount,0);
  const base=Math.max(0,(s.isrOnGross?g:Math.max(0,g-ccss))-pre);
  const isr=Math.max(0,isrMensual(base)-(Number(s.credits)||0));
  return {g,sem,ivm,bp,ccss,isr,base,pre,custom,otros,net:Math.max(0,g-ccss-isr-otros)};
}
function diasPago(s){
  const ns=(String(s&&s.dia||"").match(/\d{1,2}/g)||[]).map(Number).filter(n=>n>=1&&n<=31);

// Lo que de verdad ya entró a la cuenta a la fecha de hoy, frente a lo que falta.

function ingresoALaFecha(k){
  const hoy=new Date(), esActual=!k||k===ymKey(hoy), d=hoy.getDate();
  const diasMes=new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate();
  let recibido=0, pendiente=0, prox=null, fuentes=[];
  const sumar=(monto,dias,nombre)=>{
    monto=Number(monto)||0;
    if(monto<=0)return;
    if(!esActual||!dias.length){recibido+=monto;return}
    const efec=[...new Set(dias.map(x=>Math.min(x,diasMes)))].sort((a,b)=>a-b);
    const porPago=monto/efec.length;
    for(const x of efec){
      if(x<=d)recibido+=porPago;
      else{
        pendiente+=porPago;
        if(prox===null||x<prox)prox=x;
        fuentes.push({nombre,monto:porPago,dia:x,faltan:x-d});
      }
    }
  };
  const s=settings.salary;
  if(Number(s.gross)>0&&s.active!==false)sumar(salaryCalc(s).net,diasPago(s),s.etiqueta||s.label||"Salario");
  for(const x of settings.extraIncomes||[]){
    if(x.activo===false)continue;
    sumar(porMes(x.monto,x.freq,x.cur),diasPago(x),x.label||"Ingreso");
  }
  fuentes.sort((a,b)=>a.dia-b.dia);
  return {recibido,pendiente,prox,fuentes,total:recibido+pendiente,
          faltan:prox===null?null:Math.max(0,prox-d),
          hayCalendario:diasPago(s).length>0||(settings.extraIncomes||[]).some(x=>diasPago(x).length)};
}

}

function recurring(){

}
function incomeSources(k){

  if(salaryIncome())list.unshift({label:settings.salary.label||"Salario neto",amount:salaryIncome(),n:1,salary:true,ids:[]});

  return {base,saldo,meses:base>0?saldo/base:0,falta3:Math.max(0,base*3-saldo),falta6:Math.max(0,base*6-saldo)};
}
function savingsRate(){const i=avgIncome(),g=avgSpend();return (i>0&&g!==null)?(i-g)/i*100:null}


/* ===== Análisis: hallazgos del mes ===== */
// Todo esto es aritmética sobre tus propios movimientos. Corre en el
// teléfono, sin mandar nada a ningún lado y sin costo por consulta.
const HORMIGA_DEF = 5000;          // colones: por debajo de esto es "hormiga"
function hormigaMax(){ return Number(settings.hormigaMax) || HORMIGA_DEF }

function agrupar(txns){
  const map={};
  for(const t of txns){
    const key=mKey(t.merchant)||t.merchant;if(!key)continue;
    map[key]=map[key]||{key,name:t.merchant,total:0,n:0,cat:catOf(t),montos:[]};
    map[key].total+=spendCRC(t);map[key].n++;map[key].montos.push(toCRC(t.amount,t.currency));
  }
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function hallazgos(){
  const out=[];
  const txns=monthTxns().filter(isSpend);
  const cerrados=closedMonths().slice(0,3);
  if(!txns.length)return out;

  // 1. GASTOS HORMIGA: compras chicas que de una en una no duelen
  const tope=hormigaMax();
  const small=txns.filter(t=>toCRC(t.amount,t.currency)<=tope);
  const totalSmall=small.reduce((s,t)=>s+spendCRC(t),0);
  const spendMes=txns.reduce((s,t)=>s+spendCRC(t),0);
  if(small.length>=4&&totalSmall>0){
    const top=agrupar(small).slice(0,4);
    out.push({
      id:"hormiga",tipo:"hormiga",color:"var(--orange)",
      titulo:"Gastos hormiga",
      monto:totalSmall,
      linea:`${small.length} compras de menos de ${fCRC.format(tope)}, el ${Math.round(totalSmall/(spendMes||1)*100)}% de lo que gastaste`,
      detalle:`Al año, a este ritmo, son ${fCRC.format(totalSmall*12)}`,
      items:top.map(x=>({nombre:x.name,n:x.n,monto:x.total}))
    });
  }

  // 2. SUSCRIPCIONES: mismo comercio, monto parejo, varios meses
  // las categorías de monto variable (súper, restaurantes, compras) no son
  // suscripciones aunque el monto se parezca mes a mes
  const VARIABLES=new Set(["super","rest","deliv","shop","fun","trans"]);
  const subs=recurring().filter(r=>r.n>=2&&!VARIABLES.has(r.cat)).map(r=>{
    const montos=[];
    for(const k of cerrados)for(const t of monthTxns(k).filter(isSpend))
      if((mKey(t.merchant)||t.merchant)===r.key)montos.push(toCRC(t.amount,t.currency));
    const prom=montos.reduce((a,b)=>a+b,0)/(montos.length||1);
    const disp=montos.length>1?Math.max(...montos)-Math.min(...montos):0;
    return {...r,prom,estable:prom>0&&disp/prom<0.05};
  }).filter(x=>x.estable);
  if(subs.length){
    const tot=subs.reduce((s,x)=>s+x.avg,0);
    out.push({
      id:"subs",tipo:"subs",color:"var(--blue)",
      titulo:"Cobros fijos cada mes",
      monto:tot,
      linea:`${subs.length} comercios te cobran casi el mismo monto todos los meses`,
      detalle:`Son ${fCRC.format(tot*12)} al año comprometidos`,
      items:subs.slice(0,6).map(x=>({nombre:x.name,n:x.n,monto:x.avg}))
    });
  }

  // 3. SUBIDAS DE PRECIO: un recurrente que este mes cobró más
  const subidas=[];
  for(const r of recurring()){
    const hoy=agrupar(txns).find(x=>x.key===r.key);
    if(!hoy||r.avg<=0)continue;
    const delta=hoy.total-r.avg;
    if(delta>Math.max(500,r.avg*0.15))subidas.push({nombre:hoy.name,antes:r.avg,ahora:hoy.total,delta});
  }
  if(subidas.length){
    const tot=subidas.reduce((s,x)=>s+x.delta,0);
    out.push({
      id:"subidas",tipo:"subidas",color:"var(--red)",
      titulo:"Te subieron el precio",
      monto:tot,
      linea:`${subidas.length} ${subidas.length===1?"comercio cobra":"comercios cobran"} más que su promedio`,
      detalle:`Si se queda así, son ${fCRC.format(tot*12)} más al año`,
      items:subidas.slice(0,5).map(x=>({nombre:x.nombre,n:0,monto:x.delta,nota:`de ${fCRC.format(x.antes)} a ${fCRC.format(x.ahora)}`}))
    });
  }

  // 4. POSIBLES COBROS DUPLICADOS
  const dup={};
  for(const t of txns){
    const k=(mKey(t.merchant)||t.merchant)+"|"+t.amount+"|"+t.ts.slice(0,10);
    dup[k]=dup[k]||{name:t.merchant,amount:toCRC(t.amount,t.currency),fecha:t.ts.slice(0,10),n:0};
    dup[k].n++;
  }
  const dobles=Object.values(dup).filter(x=>x.n>1);
  if(dobles.length){
    const tot=dobles.reduce((s,x)=>s+x.amount*(x.n-1),0);
    out.push({
      id:"dup",tipo:"dup",color:"var(--red)",
      titulo:"Posibles cobros repetidos",
      monto:tot,
      linea:`${dobles.length} ${dobles.length===1?"cobro idéntico el mismo día":"cobros idénticos el mismo día"}`,
      detalle:"Puede ser normal, pero vale la pena revisarlo con el banco",
      items:dobles.slice(0,5).map(x=>({nombre:x.name,n:x.n,monto:x.amount*(x.n-1)}))
    });
  }

  // 5. COMERCIOS NUEVOS este mes
  if(cerrados.length){
    const vistos=new Set();
    for(const k of cerrados)for(const t of monthTxns(k).filter(isSpend))vistos.add(mKey(t.merchant)||t.merchant);
    const nuevos=agrupar(txns).filter(x=>!vistos.has(x.key)&&x.total>0);
    if(nuevos.length){
      const tot=nuevos.reduce((s,x)=>s+x.total,0);
      out.push({
        id:"nuevos",tipo:"nuevos",color:"var(--label2)",
        titulo:"Comercios nuevos",
        monto:tot,
        linea:`${nuevos.length} lugares donde no habías comprado en los últimos meses`,
        detalle:"",
        items:nuevos.slice(0,5).map(x=>({nombre:x.name,n:x.n,monto:x.total}))
      });
    }
  }
  return out;
}
function totalHormiga(){
  const tope=hormigaMax();
  return monthTxns().filter(isSpend).filter(t=>toCRC(t.amount,t.currency)<=tope)
    .reduce((s,t)=>s+spendCRC(t),0);
}

/* ===== Cifras del mes ===== */
function monthTxns(k){return Object.values(months[k||current]?.txns||{}).sort((a,b)=>b.ts.localeCompare(a.ts))}
function figures(k){
  const txns=monthTxns(k);
  const spend=txns.filter(isSpend).reduce((s,t)=>s+spendCRC(t),0);
  const inc=txns.filter(isIncome).reduce((s,t)=>s+toCRC(t.amount,t.currency),0)+ingresoALaFecha(k).recibido;
  const byCat={};for(const t of txns.filter(isSpend)){const c=catOf(t);byCat[c]=(byCat[c]||0)+spendCRC(t)}
  return {txns,spend,inc,queda:inc-spend,cats:Object.entries(byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])};
}
function closedMonths(){
  const now=ymKey(new Date());
  return Object.keys(months).filter(k=>k<now&&monthTxns(k).some(isSpend)).sort().reverse();
}
function mesesBase(){return closedMonths().slice(0,3)}
// Sin un mes cerrado no hay promedio: devolver el mes a medias infla lo que "sobra".
function avgSpend(){
  const ks=mesesBase();
  if(!ks.length)return null;
  return ks.reduce((s,k)=>s+figures(k).spend,0)/ks.length;
}
const avgSpendOCurso=()=>avgSpend()??figures().spend;
// Lo que te sobra al mes. null = todavía no se puede saber.
function sobraAlMes(){const g=avgSpend();return g===null?null:avgIncome()-g}
function avgIncome(){
  const ks=closedMonths().slice(0,3);
  const extra=ks.length?ks.reduce((s,k)=>s+monthTxns(k).filter(isIncome).reduce((a,t)=>a+toCRC(t.amount,t.currency),0),0)/ks.length:
    monthTxns().filter(isIncome).reduce((a,t)=>a+toCRC(t.amount,t.currency),0);
  return salaryIncome()+extra;
}
function paceEndOfMonth(){
  if(current!==ymKey(new Date()))return null;
  const now=new Date(),day=now.getDate(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const f=figures();
  if(day<3||!f.spend)return null;
  return f.spend/day*dim;
}

/* ===== Proyección ===== */
function projInputs(){
  const p=settings.proj;
  const s=sobraAlMes();
  const aporte=p.aporte===null||p.aporte===undefined?Math.max(0,Math.round(s||0)):Number(p.aporte)||0;
  return {saldo:Number(p.saldo)||0,aporte,rate:Number(p.rate)||0,plazo:Number(p.plazo)||12,meta:Number(p.meta)||0};
}
function projSeries(){
  const{saldo,aporte,rate,plazo}=projInputs();
  const r=Math.pow(1+rate/100,1/12)-1;
  const con=[saldo],sin=[saldo];
  const extra13=settings.proj.usaAguinaldo?aguinaldo()+salarioEscolar():0;
  let b=saldo,s=saldo,total=0;
  const hoy=new Date();
  for(let i=1;i<=plazo;i++){
    const mes=(hoy.getMonth()+i)%12;
    const bono=extra13?((mes===11?aguinaldo():0)+(mes===0?salarioEscolar():0)):0;
    b=b*(1+r)+aporte+bono;s=s+aporte+bono;total+=aporte+bono;
    con.push(b);sin.push(s);
  }
  return {con,sin,aportado:total,final:con[con.length-1],interes:con[con.length-1]-saldo-total};
}
function mesesParaMeta(){
  const{saldo,aporte,rate,meta}=projInputs();
  if(!meta||meta<=saldo)return meta?0:null;
  if(aporte<=0&&rate<=0)return null;
  const r=Math.pow(1+rate/100,1/12)-1;
  let b=saldo;
  for(let i=1;i<=600;i++){b=b*(1+r)+aporte;if(b>=meta)return i}
  return null;
}
function chartSVG(con,sin){
  const W=320,H=150,P=6;
  const max=Math.max(...con,1),min=Math.min(...con,...sin,0);
  const x=i=>P+(i/(con.length-1||1))*(W-P*2);
  const y=v=>H-P-((v-min)/((max-min)||1))*(H-P*2);
  const line=a=>a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const area=`${line(con)} L${x(con.length-1).toFixed(1)} ${H-P} L${x(0).toFixed(1)} ${H-P} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" style="height:150px">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--blue)" stop-opacity=".28"/><stop offset="100%" stop-color="var(--blue)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g)"/>
    <path d="${line(sin)}" fill="none" stroke="var(--label3)" stroke-width="1.6" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <path d="${line(con)}" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

/* ===== Deudas ===== */
function debtRun(d,extra){
  const B0=Number(d.balance)||0,r=(Number(d.rate)||0)/100/12,P=(Number(d.payment)||0)+(extra||0);
  if(B0<=0)return {months:0,interest:0,total:0,done:true};
  if(P<=B0*r+0.01)return {never:true,months:null,interest:null,total:null};
  let B=B0,i=0,int=0;
  while(B>0&&i<1200){const ib=B*r;int+=ib;B=B+ib-P;i++;if(B<0)B=0}
  return {months:i,interest:int,total:B0+int,never:false};
}
const DEUDA_TIPOS=[
  {k:"tarjeta",n:"Tarjeta de crédito",c:"#F0564A"},

];

// Qué decirle a alguien que arrastra saldo de tarjeta, con sus propios números
function consejoTarjeta(d){
  const saldo=Number(d.balance)||0, tasa=Number(d.rate)||0, cuota=Number(d.payment)||0;
  if(!saldo)return null;
  if(!tasa)return {tono:"info",t:"Buscá la tasa en tu estado de cuenta",
    p:"En Costa Rica las tarjetas suelen andar entre 30% y 50% anual, muy por encima de cualquier otro préstamo. Sin ese número no puedo decirte cuánto te está costando de verdad."};
  const mesInteres=saldo*tasa/100/12;
  if(!cuota)return {tono:"alerta",t:`Solo en intereses se te van ${fCRC.format(mesInteres)} al mes`,
    p:"Poné cuánto abonás y te digo cuándo salís."};
  const c=debtCalc({...d,extra:0});
  if(c.never)return {tono:"alerta",t:"Con esa cuota el saldo nunca baja",
    p:`Los intereses del mes son ${money(mesInteres,d.currency)} y estás abonando ${money(cuota,d.currency)}. Hay que subir la cuota por encima de eso para empezar a bajar el saldo.`};
  // cuánto habría que abonar para salir en un año
  const i=tasa/100/12;
  const cuota12=i>0?saldo*i/(1-Math.pow(1+i,-12)):saldo/12;
  const extra=Math.max(0,Math.ceil((cuota12-cuota)/1000)*1000);
  if(c.months<=12)return {tono:"bien",t:`Vas bien: salís en ${c.months} ${c.months===1?"mes":"meses"}`,
    p:`Vas a pagar ${money(c.interest,d.currency)} de intereses en total. Mientras no le metás compras nuevas, esto se cierra solo.`};
  const conExtra=debtCalc({...d,extra});
  return {tono:"alerta",
    t:`${c.months} meses y ${money(c.interest,d.currency)} de intereses`,
    p:`Esta es la deuda más cara que podés tener. ${extra>0&&!conExtra.never?`Si le subís ${money(extra,d.currency)} a la cuota, salís en ${conExtra.months} meses y te ahorrás ${money(c.interest-conExtra.interest,d.currency)}.`:"Pagá todo lo que puedas por encima de la cuota: cada colón extra va directo al saldo."} Lo ideal es dejar de arrastrar saldo y pagar de contado cada mes.`};
}
function debtCalc(d){
  const con=debtRun(d,Number(d.extra)||0),sin=debtRun(d,0);
  return {...con,base:sin,ahorro:(!con.never&&!sin.never&&d.extra>0)?sin.interest-con.interest:0,mesesMenos:(!con.never&&!sin.never&&d.extra>0)?sin.months-con.months:0};
}
function debtTotals(){
  const ds=settings.debts||[];
  let saldo=0,cuota=0,interes=0,maxMes=0,alguno=false,nunca=false;
  for(const d of ds){
    const c=debtCalc(d),f=d.currency==="USD"?(Number(settings.fx)||0):1;
    saldo+=(Number(d.balance)||0)*f;cuota+=((Number(d.payment)||0)+(Number(d.extra)||0))*f;
    if(c.never)nunca=true;else{interes+=(c.interest||0)*f;maxMes=Math.max(maxMes,c.months||0);alguno=true}
  }
  return {saldo,cuota,interes,maxMes,alguno,nunca,n:ds.length};
}
function enMeses(n){const d=new Date();d.setMonth(d.getMonth()+n);return d.toLocaleDateString("es-CR",{month:"long",year:"numeric"})}

const MES={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,SET:9,OCT:10,NOV:11,DIC:12};
function isoFromEmail(d){const x=new Date(d);return isNaN(x)?null:`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`}
function parseCard(msg){
  const body=msg.plaintextBody||msg.snippet||"";
  const map={};
  for(const raw of body.split("\n")){
    const line=raw.replace(/\|/g," ").replace(/\s+/g," ").trim();
    const m=line.match(/^([A-Za-zÁÉÍÓÚáéíóúñÑ ]{3,40}):\s*(.+)$/);
    if(m)map[m[1].trim().toLowerCase()]=m[2].trim();
  }
  const holderM=body.replace(/[|#]/g," ").replace(/\s+/g," ").match(/Hola\s+(.+?)\s+A continuaci/i);
  const montoRaw=map["monto"];if(!montoRaw)return null;
  const mm=montoRaw.match(/(USD|CRC|\$|₡|[A-Z]{3})\s*([\d.,]+)/);if(!mm)return null;
  const currency=/USD|\$/.test(mm[1])?"USD":(mm[1]==="CRC"||mm[1]==="₡"?"CRC":mm[1]);
  let ts=null;
  const f=(map["fecha"]||"").match(/([A-Za-z]{3})\w*\.?\s+(\d{1,2}),?\s*(\d{4})\s*,?\s*(\d{1,2}):(\d{2})/);
  if(f&&MES[f[1].toUpperCase()])ts=`${f[3]}-${pad(MES[f[1].toUpperCase()])}-${pad(f[2])}T${pad(f[4])}:${f[5]}`;
  ts=ts||isoFromEmail(msg.date);
  let card="";
  for(const k of Object.keys(map))if(/^(master|visa|amex|american express|mastercard|tarjeta)/.test(k)){const d=map[k].match(/(\d{4})\s*$/);card=k.split(" ")[0].toUpperCase()+(d?" ••"+d[1]:"");break}
  const tipo=(map["tipo de transacción"]||map["tipo de transaccion"]||"").toUpperCase();
  return {id:msg.id,kind:"card",ts,merchant:map["comercio"]||(msg.subject||"").replace(/Notificaci.n de transacci.n/i,"").trim(),
    place:map["ciudad y país"]||map["ciudad y pais"]||"",amount:num(mm[2]),currency,card,tipo,
    refund:/DEVOL|REVERS|ANUL|CR[EÉ]DITO|REEMBOLSO/.test(tipo),
    auth:map["autorización"]||map["autorizacion"]||"",ref:map["referencia"]||"",
    holder:holderM?holderM[1].trim():""};
}
function parseSinpe(msg){
  const t=(msg.plaintextBody||msg.snippet||"").replace(/[|]/g," ").replace(/\s+/g," ");
  const a=t.match(/monto de\s*([\d.,]+)\s*(D[oó]lares|Colones|USD|CRC)/i);if(!a)return null;
  const currency=/d[oó]lar|usd/i.test(a[2])?"USD":"CRC";
  const who=(t.match(/Hola:?\s*([^:]+?)\s*:/i)||[])[1]||"";
  const concept=((t.match(/por concepto de\s*(.+?)\.\s/i)||[])[1]||"").replace(/_+/g," ").trim();
  const d=t.match(/el (?:d[ií]a )?(\d{1,2})\/(\d{1,2})\/(\d{4}) a las (\d{1,2}):(\d{2})(?::\d{2})?\s*(a\.?\s?m\.?|p\.?\s?m\.?)?/i);
  let ts=null;
  if(d){let h=+d[4];const ap=(d[6]||"").toLowerCase().replace(/[\s.]/g,"");if(ap){const pm=ap.charAt(0)==="p";if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}ts=`${d[3]}-${pad(d[2])}-${pad(d[1])}T${pad(h)}:${d[5]}`}
  ts=ts||isoFromEmail(msg.date);
  const credit=/acreditando|recibi[oó]|ha recibido/i.test(t);
  const whoClean=who.replace(/_+/g," ").trim();
  if(credit)return {id:msg.id,kind:"sinpe",ts,merchant:"Ingreso SINPE"+(concept?": "+concept:""),beneficiary:"",concept,amount:num(a[1]),currency,income:true,own:false,refund:false};
  return {id:msg.id,kind:"sinpe",ts,merchant:whoClean?"SINPE a "+whoClean:"Transferencia SINPE",beneficiary:whoClean,concept,amount:num(a[1]),currency,income:false,refund:false};
}
function isOwnName(name){
  const h=(settings.holder||"").toUpperCase().split(/\s+/).filter(w=>w.length>2);
  const n=String(name||"").toUpperCase().split(/\s+/).filter(w=>w.length>2);
  if(h.length<2||!n.length)return false;
  return n.filter(w=>h.includes(w)).length>=2;
}

async function initStore(){
  try{
    const[db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);
    const uid=user?await user.id():null;
    if(db&&uid){
      const root=db.doc(`data/users/${uid}/fin`);
      store={kind:"db",root};
      const snap=await root.get();
      if(snap.exists){
        const d=structuredClone(snap.data());
        settings={...structuredClone(DEF),...d};
        settings.salary={...structuredClone(SALARY),...(d.salary||{})};
        settings.salary.rates={...SALARY.rates,...(d.salary?.rates||{})};
        settings.proj={...structuredClone(PROJ),...(d.proj||{})};
      }
      const q=await root.collection("months").get();
      for(const doc of q.docs)months[doc.id]=structuredClone(doc.data());
      migrate();
      return;
    }
  }catch(e){console.warn("db",e)}
  store={kind:"local"};
  try{
    const raw=localStorage.getItem("pacci-v1")||localStorage.getItem("plata-v1");
    if(raw){const o=JSON.parse(raw);settings={...structuredClone(DEF),...o.settings};
      settings.salary={...structuredClone(SALARY),...(o.settings?.salary||{})};
      settings.proj={...structuredClone(PROJ),...(o.settings?.proj||{})};
      months=o.months||{}}
  }catch(e){}
  migrate();
}
function saveLocal(){try{localStorage.setItem("pacci-v1",JSON.stringify({settings,months}))}catch(e){}}
async function saveSettings(){
  settings.skipped=(settings.skipped||[]).slice(-1500);
  if(store?.kind==="db"){try{await store.root.set(settings)}catch(e){toast("No se pudieron guardar los ajustes.",true)}}
  else saveLocal();
}
async function saveMonths(keys){

function payloadOf(r){let p=r?.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}return p||{}}
async function read(mcp,tool,input){
  try{return payloadOf(await mcp.callTool("Gmail",tool,input,{cache:false}))}
  catch(e){
    if(e?.retryable){await new Promise(r=>setTimeout(r,(e.retryAfterMs||800)+Math.random()*600));return payloadOf(await mcp.callTool("Gmail",tool,input,{cache:false}))}
    throw e;
  }
}
function sinceDate(n){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(n-1));return `${d.getFullYear()}/${pad(d.getMonth()+1)}/01`}
async function sync(){
  if(syncing)return;
  if(!caps.mcp){toast("Esta vista no puede leer Gmail. Abrila desde claude.ai o la app de Claude.",true);return}
  syncing=true;render();
  const mcp=caps.mcp;
  const q=`from:baccredomatic.cr {subject:transacción subject:transaccion subject:transferencia} after:${sinceDate(Number(settings.monthsBack)||5)}`;
  toast("Buscando correos de BAC…");
  const known=knownIds(),todo=[];
  try{
    let token=null,pages=0;
    do{
      const p=await read(mcp,"search_threads",token?{query:q,pageSize:50,pageToken:token}:{query:q,pageSize:50});
      for(const th of p.threads||[])for(const m of th.messages||[]){
        if(known.has(m.id)||todo.some(x=>x.id===m.id))continue;
        const s=m.subject||"";
        if(/transacci/i.test(s))todo.push({id:m.id,type:"card"});
        else if(/transferencia/i.test(s))todo.push({id:m.id,type:"sinpe"});
      }
      token=p.nextPageToken||null;pages++;
    }while(token&&pages<25);
  }catch(e){return failSync(e)}
  if(!todo.length){settings.lastSync=new Date().toISOString();await saveSettings();syncing=false;toast("Todo al día.");render();return}
  let done=0,added=0,failed=0,fatal=null;const dirty=new Set();
  const tick=()=>toast(`Leyendo movimientos, ${done} de ${todo.length}`,false,done/todo.length);
  tick();
  const queue=todo.slice();
  async function worker(){
    while(queue.length&&!fatal){
      const job=queue.shift();
      try{
        const msg=await read(mcp,"get_message",{messageId:job.id,messageFormat:"PLAIN_TEXT"});
        const t=job.type==="card"?parseCard(msg):parseSinpe(msg);
        if(!t||!t.ts)settings.skipped.push(job.id);
        else{
          if(t.kind==="card"&&t.holder&&!settings.holder)settings.holder=t.holder;
          delete t.holder;
          const k=t.ts.slice(0,7);
          months[k]=months[k]||{txns:{}};
          const dup=t.kind==="card"&&t.auth&&Object.values(months[k].txns).some(x=>x.auth===t.auth&&x.ref===t.ref&&x.amount===t.amount);
          if(dup)settings.skipped.push(job.id);
          else{months[k].txns[t.id]=t;dirty.add(k);added++}
        }
      }catch(e){
        if(["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy","not_granted","capability_disabled","consent_required","selection_required","approval_required"].includes(e?.code))fatal=e;
        else failed++;
      }
      done++;tick();
      if(done%25===0&&dirty.size){const ks=[...dirty];dirty.clear();await saveMonths(ks)}
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  for(const t of allTxns())if(t.kind==="sinpe"&&!t.income){const own=isOwnName(t.beneficiary);if(own!==!!t.own){t.own=own;dirty.add(t.ts.slice(0,7))}}
  if(dirty.size)await saveMonths([...dirty]);
  settings.lastSync=new Date().toISOString();await saveSettings();
  syncing=false;
  if(fatal)return failSync(fatal,added);
  if(!months[current]){const ks=Object.keys(months).sort();if(ks.length)current=ks[ks.length-1]}
  toast(`Listo, ${added} movimientos nuevos${failed?`, ${failed} correos no se pudieron leer`:""}.`);
  render();
}
function failSync(e,added){
  syncing=false;
  toast((added?`Se guardaron ${added} movimientos. `:"")+(ERR[e?.code]||"Error leyendo Gmail."),true);
  render();
}

Categorías (usá solo el id):

other = si de verdad no se puede saber

Respondé SOLO un objeto JSON {"COMERCIO":"id"} con exactamente estas claves:
