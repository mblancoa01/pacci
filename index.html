<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>Pacci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#5A63EC; --indigo-2:#7E8BFF; --indigo-3:#434BD6;
  --bg:#F3F4FD; --card:#FFFFFF; --sunk:#F7F8FE;
  --ink:#131630; --label:#131630; --label2:#767B9B; --label3:#A6AAC4;
  --line:#ECEDF7; --sep:#ECEDF7; --fill:#ECEDF7;
  --green:#2FC79A; --mint:#2FC79A; --red:#FF7568; --orange:#F7B938;
  --blue:#5A63EC; --violet:#A77BEA;
  --chrome:rgba(255,255,255,.88);
  --shadow:0 4px 18px -8px rgba(90,99,236,.16);
  --r:26px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0C17; --card:#161930; --sunk:#1D2140;
  --ink:#EEF0FF; --label:#EEF0FF; --label2:#9095B8; --label3:#636889;
  --line:#242848; --sep:#242848; --fill:#242848;
  --chrome:rgba(22,25,48,.86);
  --shadow:0 4px 18px -10px rgba(0,0,0,.6);
}}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--indigo);outline-offset:3px;border-radius:12px}

/* ---------- shell ---------- */
#hdr{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(50px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;
  background:var(--chrome);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid transparent;opacity:0;transition:opacity .22s ease,border-color .22s;pointer-events:none}
#hdr.show{opacity:1;border-bottom-color:var(--line);pointer-events:auto}
#hdr b{font-size:16px;font-weight:700;letter-spacing:-.02em}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.app{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 6px) 18px calc(112px + env(safe-area-inset-bottom,0px))}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page{animation:pop .3s cubic-bezier(.22,.7,.3,1)}
@media (prefers-reduced-motion:reduce){.page{animation:none}}

/* ---------- cabecera de vista ---------- */
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 18px}
.title{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.12;margin:0}
.title small{display:block;font-size:13px;font-weight:500;color:var(--label2);letter-spacing:-.01em;margin-top:4px}
.round{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;
  color:var(--indigo);flex:0 0 auto;box-shadow:var(--shadow);transition:transform .14s}
.round:active{transform:scale(.92)}
.round svg{width:19px;height:19px}
.round.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

h2.sec{font-size:16px;font-weight:700;letter-spacing:-.025em;color:var(--ink);
  margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h2.sec button,h2.sec span{font-size:12.5px;font-weight:600;color:var(--indigo);letter-spacing:-.01em}
h2.sec button:active{opacity:.55}

/* ---------- tarjeta de saldo ---------- */
.balance{border-radius:30px;padding:24px 22px 22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(152deg,var(--indigo-2) 0%,var(--indigo) 48%,var(--indigo-3) 100%);
  box-shadow:0 16px 36px -14px rgba(66,74,212,.55)}
.balance::after{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.26),rgba(255,255,255,0) 68%)}
.balance .lbl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:rgba(255,255,255,.78);margin:0}
.balance .lbl b{font-weight:600;color:#fff;background:rgba(255,255,255,.17);padding:3px 9px;border-radius:999px;font-size:11.5px;text-transform:capitalize}
.balance .amt{margin:9px 0 0;font-size:clamp(34px,10.5vw,42px);font-weight:800;letter-spacing:-.045em;line-height:1.04}
.balance .amt span{font-size:.56em;font-weight:600;opacity:.82}
.balance .sub{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:5px;font-weight:500}
.split{display:flex;gap:10px;margin-top:20px;position:relative}
.split div{flex:1;background:rgba(255,255,255,.15);border-radius:17px;padding:11px 13px;min-width:0}
.split span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:rgba(255,255,255,.82);font-weight:500}
.split span svg{width:12px;height:12px;flex:0 0 auto}
.split b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.03em;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- accesos circulares ---------- */
.quick{display:flex;justify-content:space-between;gap:6px;margin:20px 2px 0}
.quick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.quick .ic{width:54px;height:54px;border-radius:19px;display:grid;place-items:center;color:#fff;
  box-shadow:0 7px 16px -8px rgba(19,22,48,.45);transition:transform .16s}
.quick button:active .ic{transform:scale(.9)}
.quick .ic svg{width:22px;height:22px}
.quick em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--label2);letter-spacing:-.01em;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- tarjetas y grupos ---------- */
.group,.widget{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.group{overflow:hidden}
.group+.group{margin-top:14px}
.widget{padding:20px;margin-top:14px}
.widget:first-child{margin-top:0}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--label2);font-size:13px;font-weight:600}
.money{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.045em;line-height:1.06;margin:8px 0 0}
.money.neg{color:var(--red)}
.money.mid{font-size:27px;letter-spacing:-.035em}
.sub{font-size:13px;color:var(--label2);margin-top:6px;line-height:1.38;font-weight:500}
.pair{display:flex;gap:10px;margin-top:16px}
.pair div{flex:1;background:var(--sunk);border-radius:16px;padding:11px 13px;min-width:0}
.pair span{display:block;font-size:11.5px;color:var(--label2);font-weight:600}
.pair b{display:block;font-size:16px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.pair b.in{color:var(--green)}
.band{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:16px;background:var(--fill);gap:2px}
.band span{transition:width .4s cubic-bezier(.32,.72,0,1);border-radius:2px}

/* medidor */
.gauge{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.gauge svg{width:186px;height:104px;display:block}
.gauge .val{margin:-32px 0 0;font-size:29px;font-weight:800;letter-spacing:-.045em}
.gauge .cap{font-size:12.5px;color:var(--label2);font-weight:500;margin:2px 0 0;text-align:center}
.legend{display:flex;gap:10px;margin-top:16px;width:100%}
.legend div{flex:1;background:var(--sunk);border-radius:16px;padding:11px 13px;text-align:center;min-width:0}
.legend span{display:block;font-size:11.5px;color:var(--label2);font-weight:600;margin-bottom:2px}
.legend b{font-size:15px;font-weight:700;letter-spacing:-.03em}

/* ---------- celdas ---------- */
.cell{display:flex;align-items:center;gap:13px;width:100%;padding:13px 17px;text-align:left;
  position:relative;background:none;transition:background .12s}
button.cell:active{background:var(--sunk)}
.cell+.cell::before,.cell+.ded::before,.ded+.cell::before,.ded+.ded::before{
  content:"";position:absolute;left:17px;right:0;top:0;height:1px;background:var(--line)}
.cell .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.cell .ic svg{width:18px;height:18px}
.cell .tx{flex:1;min-width:0}
.cell .tx b{display:block;font-weight:600;font-size:14.5px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .tx span{display:block;font-size:12px;color:var(--label2);font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .val{font-size:14.5px;font-weight:700;letter-spacing:-.03em;text-align:right;white-space:nowrap;flex:0 0 auto}
.cell .val.in{color:var(--green)}
.cell .val small{display:block;font-size:11.5px;font-weight:600;color:var(--label3);margin-top:1px}
.cell label{flex:1;font-size:14.5px;font-weight:600;letter-spacing:-.015em}
.cell label em{display:block;font-style:normal;font-size:12px;color:var(--label2);font-weight:500;margin-top:2px;line-height:1.35}
.cell.off .tx b,.cell.off .val{color:var(--label3);text-decoration:line-through}
.cell.compact{padding:11px 17px}
.cell.compact .ic{width:34px;height:34px;border-radius:12px}
.cell.compact .ic svg{width:15px;height:15px}
.cell[aria-pressed="true"]{background:var(--sunk)}
.dot{width:40px;height:40px;border-radius:14px;flex:0 0 auto}
.cell.compact .dot{width:34px;height:34px;border-radius:12px}
.meter{display:block;height:5px;border-radius:3px;background:var(--fill);margin-top:7px;width:100%;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;transition:width .4s cubic-bezier(.32,.72,0,1)}
.chev{color:var(--label3);flex:0 0 auto}
.day{font-size:12.5px;color:var(--label2);font-weight:600;margin:18px 6px 8px;text-transform:capitalize}

/* ---------- mosaicos ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.tile{background:var(--card);border-radius:21px;padding:15px;text-align:left;display:block;
  box-shadow:var(--shadow);transition:transform .14s}
.tile:active{transform:scale(.96)}
.tile .ic{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:11px}
.tile .ic svg{width:17px;height:17px}
.tile .lab{font-size:12px;color:var(--label2);font-weight:600}
.tile .big{font-size:19px;font-weight:800;letter-spacing:-.04em;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .delta{font-size:11.5px;color:var(--label2);font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .delta.up{color:var(--red)}
.tile .delta.down{color:var(--green)}

.hero-min{padding:2px 4px 16px}
.hero-min .k{font-size:13px;color:var(--label2);font-weight:600}
.hero-min .v{font-size:40px;font-weight:800;letter-spacing:-.05em;line-height:1.05;margin-top:3px}
.hero-min .v.neg{color:var(--red)}
.hero-min .s{font-size:13px;color:var(--label2);margin-top:4px;font-weight:500}

/* ---------- controles ---------- */
.strip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:var(--card);border-radius:999px;padding:8px 15px;font-size:13.5px;
  font-weight:600;color:var(--label2);text-transform:capitalize;box-shadow:var(--shadow);transition:transform .12s}
.pill:active{transform:scale(.94)}
.pill[aria-pressed="true"]{background:var(--indigo);color:#fff;box-shadow:0 6px 14px -6px rgba(90,99,236,.6)}
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:11px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--label2);transition:all .18s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px -2px rgba(19,22,48,.14)}

input[type=text],input[type=number],input[type=date],select{padding:9px 12px;border:1px solid var(--line);
  border-radius:13px;background:var(--sunk);max-width:150px;text-align:right;font-size:15.5px;font-weight:600;appearance:none}
input[type=date]{text-align:left}
select{text-align:left;padding-right:28px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='%23767B9B' d='M6 8.5 2.5 5h7z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:11px}
.pct{max-width:82px}
.hero-input{width:100%;max-width:none;text-align:left;font-size:30px;font-weight:800;letter-spacing:-.04em;padding:13px 15px;border-radius:17px}
.search{width:100%;max-width:none;text-align:left;margin:0 0 12px;padding:12px 15px;font-size:15px;font-weight:500;border-radius:16px;background:var(--card);border-color:transparent;box-shadow:var(--shadow)}
input[type=checkbox]{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--fill);
  position:relative;transition:background .25s cubic-bezier(.32,.72,0,1);flex:0 0 auto;border:0}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(19,22,48,.2);transition:transform .25s cubic-bezier(.32,.72,0,1)}
input[type=checkbox]:checked{background:var(--indigo)}
input[type=checkbox]:checked::after{transform:translateX(20px)}

.btn{background:var(--indigo);color:#fff;border-radius:16px;padding:13px 20px;font-size:15.5px;font-weight:700;
  letter-spacing:-.015em;transition:transform .12s,opacity .12s;box-shadow:0 8px 18px -8px rgba(90,99,236,.7)}
.btn:active{transform:scale(.97);opacity:.9}
.btn.quiet{background:var(--sunk);color:var(--indigo);box-shadow:none}
.btn.destruct{background:var(--sunk);color:var(--red);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:12px}
.btn[disabled]{opacity:.45}

.ded{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 17px;position:relative}
.ded input[type=text]{text-align:left;max-width:none}
.ded .x{background:var(--sunk);border-radius:12px;width:36px;height:36px;color:var(--red);font-size:19px;line-height:1}

.note{font-size:12.5px;color:var(--label2);margin:10px 6px 0;line-height:1.45;font-weight:500}
.blank{background:var(--card);border-radius:var(--r);padding:30px 22px;text-align:center;box-shadow:var(--shadow)}
.blank p{color:var(--label2);font-size:14.5px;margin:0 0 18px;line-height:1.45;font-weight:500}
.chart{width:100%;display:block;margin-top:12px;overflow:visible}

/* hallazgos */
.find{background:var(--card);border-radius:22px;padding:17px;margin-top:12px;box-shadow:var(--shadow)}
.find .hd{display:flex;align-items:center;gap:12px}
.find .hd .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.find .hd .ic svg{width:17px;height:17px}
.find .hd b{font-size:15.5px;font-weight:700;letter-spacing:-.02em;flex:1}
.find .hd .amt{font-size:16px;font-weight:800;letter-spacing:-.035em}
.find .l1{font-size:13.5px;color:var(--label2);margin-top:9px;line-height:1.4;font-weight:500}
.find .l2{font-size:13px;margin-top:4px;font-weight:600}
.find ul{list-style:none;margin:13px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.find li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;font-weight:600}
.find li span{color:var(--label2);font-size:12px;font-weight:500}
.find li .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* avisos */
.toast{margin:0 0 14px;padding:14px 16px;border-radius:18px;background:var(--card);font-size:14px;
  color:var(--label2);font-weight:500;box-shadow:var(--shadow);animation:pop .22s}
.toast.err{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--ink)}
.bar{height:4px;background:var(--fill);border-radius:2px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);width:0;transition:width .3s}

/* ---------- barra inferior ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  padding:0 18px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs ul{display:flex;align-items:center;gap:3px;background:var(--chrome);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-radius:24px;padding:7px;margin:0;list-style:none;width:100%;max-width:404px;pointer-events:auto;
  box-shadow:0 10px 30px -10px rgba(19,22,48,.26)}
nav.tabs li{flex:1;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;
  border-radius:17px;color:var(--label3);font-size:10px;font-weight:700;letter-spacing:-.01em;transition:all .2s}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-current="page"]{background:var(--indigo);color:#fff;box-shadow:0 6px 14px -6px rgba(90,99,236,.65)}

/* ---------- hojas ---------- */
dialog{border:0;border-radius:28px;padding:0;width:calc(100% - 16px);max-width:440px;margin:auto auto 8px;
  background:var(--bg);color:var(--ink);max-height:90vh;overflow:hidden}
dialog::backdrop{background:rgba(10,12,26,.5);animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
dialog[open]{animation:up .34s cubic-bezier(.32,.72,0,1)}
dialog.closing{animation:down .25s cubic-bezier(.32,.72,0,1) forwards}
@keyframes down{to{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){dialog[open],dialog.closing{animation:none}}
.sheet{padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:90vh}
.grab{width:38px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 14px;touch-action:none}
.sheet h3{font-size:19px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px;text-align:center}
.sheet .sm{color:var(--label2);font-size:13.5px;margin:0 0 16px;text-align:center;line-height:1.42;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border-radius:15px;padding:12px 13px;background:var(--card);display:flex;gap:9px;align-items:center;
  font-size:14px;font-weight:600;text-align:left;transition:transform .12s;box-shadow:var(--shadow)}
.opt:active{transform:scale(.96)}
.opt i{width:11px;height:11px;border-radius:4px;flex:0 0 auto}
.opt[aria-pressed="true"]{background:var(--indigo);color:#fff}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1}

input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* ---------- cuestionario ---------- */
nav.tabs[hidden]{display:none}
.wiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 12px}
.wiz-top .paso{font-size:12.5px;font-weight:700;color:var(--label2);letter-spacing:-.01em}
.wiz-top button{font-size:13px;font-weight:600;color:var(--label2);padding:4px}
.prog{display:flex;gap:5px;padding:0 4px 22px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--fill);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--indigo-2),var(--indigo));transition:width .55s cubic-bezier(.3,.85,.3,1)}
.prog i.on::after{width:100%}
.prog i.now::after{width:100%;animation:latir 1.9s ease-in-out infinite}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.prog i.now::after{animation:none}}
.wiz h1{font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1.2;margin:0 4px 7px}
.wiz .intro{font-size:14.5px;color:var(--label2);line-height:1.5;margin:0 4px 20px;font-weight:500}

/* bienvenida */
.hola{text-align:center;padding:26px 8px 0}
.hola .mark{width:86px;height:86px;border-radius:29px;margin:0 auto 24px;display:grid;place-items:center;
  background:linear-gradient(152deg,var(--indigo-2),var(--indigo-3));box-shadow:0 18px 34px -16px rgba(66,74,212,.7)}
.hola .mark svg{width:40px;height:40px;color:#fff}
.hola h1{font-size:29px;font-weight:800;letter-spacing:-.042em;margin:0 0 12px;line-height:1.16}
.hola>p{font-size:15px;color:var(--label2);line-height:1.55;margin:0 auto;max-width:31em;font-weight:500}
.puntos{text-align:left;margin:26px auto 0;max-width:31em}

.person{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:12px 17px;position:relative}
.person+.person::before,.cell+.person::before,.person+.cell::before{content:"";position:absolute;left:17px;right:0;top:0;height:1px;background:var(--line)}
.person .av{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:0 0 auto}

.person .x{background:var(--sunk);border-radius:12px;width:36px;height:36px;color:var(--red);font-size:19px;line-height:1;flex:0 0 auto}

/* fuentes de ingreso */
.src{background:var(--card);border-radius:20px;padding:15px 15px 6px;margin-top:11px;box-shadow:var(--shadow)}
.src .fila{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.src .fila input[type=text]{flex:1;max-width:none;text-align:left}
.src .campo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0}

.src .campo>label{font-size:13.5px;font-weight:600;flex:1;letter-spacing:-.01em}
.src .campo>label em{display:block;font-style:normal;font-size:11.5px;color:var(--label2);font-weight:500;margin-top:2px;line-height:1.35}
.src .campo.col{display:block}
.src .campo.col>label{margin-bottom:9px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--sunk);border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--label2);transition:all .16s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--indigo);color:#fff}

/* metas */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.goal{background:var(--card);border-radius:21px;padding:19px 14px;text-align:center;box-shadow:var(--shadow);transition:transform .14s,box-shadow .2s}

.goal .ic{width:50px;height:50px;border-radius:18px;margin:0 auto 11px;display:grid;place-items:center;color:#fff}
.goal .ic svg{width:23px;height:23px}

.goal[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--indigo),var(--shadow)}
.goal.wide{grid-column:1/3;display:flex;align-items:center;gap:13px;text-align:left;padding:15px}
.goal.wide .ic{margin:0;width:44px;height:44px;border-radius:16px}

/* correo */
.privacidad{background:var(--sunk);border-radius:20px;padding:16px;margin-top:14px}
.privacidad .t{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:-.02em}

  font-size:12px;font-weight:800;flex:0 0 auto}

.pasos3 b{color:var(--ink);font-weight:700}

<script>
(function(){
"use strict";

/* ===== Categorías ===== */
const CATS=[
  {id:"super",name:"Supermercado",color:"#34C759"},{id:"rest",name:"Restaurantes",color:"#FF9500"},
  {id:"deliv",name:"Delivery",color:"#FFCC00"},{id:"trans",name:"Transporte",color:"#007AFF"},
  {id:"subs",name:"Suscripciones",color:"#AF52DE"},{id:"shop",name:"Compras",color:"#FF2D55"},
  {id:"health",name:"Salud",color:"#5AC8FA"},{id:"fun",name:"Entretenimiento",color:"#FF6482"},
  {id:"serv",name:"Servicios",color:"#64D2FF"},{id:"home",name:"Vivienda",color:"#A2845E"},
  {id:"biz",name:"Negocio",color:"#30B0C7"},{id:"pets",name:"Mascotas",color:"#BF5AF2"},
  {id:"transfer",name:"Transferencias",color:"#8E8E93"},{id:"other",name:"Otros",color:"#AEAEB2"}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const RULES=[
  ["deliv",/UBER ?EATS|RAPPI|DIDI ?FOOD|GLOVO|PEDIDOS ?YA/],
  ["biz",/METAPAY|FACEBK|META ?ADS|GOOGLE ?ADS|GODADDY|\bWIX\b|SQUARESPACE|NAMECHEAP|SHOPIFY|HOSTINGER|CLOUDFLARE|VERCEL/],
  ["subs",/SPOTIFY|NETFLIX|APPLE|ITUNES|GOOGLE|MICROSOFT|DROPBOX|ADOBE|DISNEY|\bHBO\b|\bMAX\b|YOUTUBE|OPENAI|CHATGPT|ANTHROPIC|CLAUDE|PRIME ?VIDEO|ICLOUD|LOCKR|CANVA|NOTION|AUTODESK|PATREON|CRUNCHYROLL|PARAMOUNT|LINKEDIN|DUOLINGO|GITHUB|FIGMA/],
  ["trans",/\bUBER\b|\bDIDI\b|INDRIVE|ESTACION DE SERV|SERVICENTRO|GASOLINER|\bDELTA\b|PARQUEO|PARKING|PEAJE|GLOBALVIA|RITEVE|COMPASS|AUTOPISTA|TAXI|COMBUSTIBLE/],
  ["super",/AUTO ?MERCADO|FRESH ?MARKET|\bMXM\b|MAS ?X ?MENOS|WALMART|\bPALI\b|MEGA ?SUPER|PERIMERCADO|\bSUPER\b|MINI ?SUPER|PRICESMART|\bAM ?PM\b|VINDI|SARET|FEDERADO|CARNICERIA|VERDULERIA|FRUTERIA/],
  ["rest",/\bSODA\b|RESTAUR|\bREST\b|CAFE|COFFEE|MCDONALD|BURGER|\bKFC\b|PIZZA|POLLO|TACO|SUSHI|CEVICHE|STARBUCKS|SUBWAY|WENDY|SAZON|\bBAR\b|CERVEC|PANADER|HELAD|\bPOPS\b|SPOON|RAMEN|GRILL|BBQ|COMIDA|MARISQ|PARRILLA|CHICKEN|DONUT|DUNKIN|PAPA JOHN|CHILI|OUTBACK|BISTRO|TRATTORIA|PANCHO|BURRITO|WINGS/],
  ["health",/FARMAC|FISCHEL|SUCRE|LA BOMBA|HOSPITAL|CLINIC|LABORATORIO|DENTAL|OPTIC|MEDIC|GYM|GIMNASIO|SMART ?FIT|CROSSFIT/],
  ["pets",/VETERIN|\bPETS?\b|MASCOTA|AGROVET|ANIMAL/],
  ["fun",/CINE|CINEMA|TEATRO|TICKET|EVENTO|PLAYSTATION|STEAM|XBOX|NINTENDO|CONCIERTO|BOLICHE|EXPERIENCE|MUSEO/],
  ["serv",/KOLBI|\bICE\b|CLARO|LIBERTY|TIGO|CNFL|\bAYA\b|ESPH|JASEC|INTERNET|TELEF|CABLE|SEGURO|\bINS\b|MUNICIPALIDAD|RECARGA|ELECTRIC/],
  ["home",/\bALQ|ALQUILER|RENTA|CONDOMINIO|CUOTA MANT/],
  ["shop",/ROPA|OUTLET|TIENDA|ZARA|\bH ?& ?M\b|NIKE|ADIDAS|AMAZON|AMZN|TEMU|SHEIN|EBAY|ALIEXPRESS|\bEPA\b|CONSTRUPLAZA|FERRETER|UNIVERSAL|MALL|BOUTIQUE|ZAPAT|SIMAN|LIBRERIA|IKEA|MONGE|GOLLO|STORE|SHOP/]
];

/* ===== Estado ===== */
const SALARY={gross:0,rates:{sem:5.5,ivm:4.33,bp:1},isrOnGross:true,credits:0,custom:[],active:true,activeSet:false,escolar:false,tipo:"planilla",freq:"mensual",grossPer:0,label:"Salario neto"};
const PROJ={saldo:0,aporte:null,rate:5,plazo:12,meta:0,usaAguinaldo:true};
const DEF={name:"",onboarded:false,hormigaMax:5000,people:[],extraIncomes:[],hasSav:null,hasDebt:null,goal:null,fxDate:"2026-10-02",fx:460,monthsBack:5,includeOwn:false,rules:{},excludeKeys:{},debts:[],holder:"",skipped:[],lastSync:null,salary:structuredClone(SALARY),proj:structuredClone(PROJ)};
let settings=structuredClone(DEF);
let months={}, current=ymKey(new Date()), tab="inicio", filterCat=null, filterMet=null, filterSmall=false, query="", syncing=false, store=null, wiz=0, probe=null;
const caps={mcp:null,sample:null};

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
function ymKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function pad(n){return String(n).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const miles=n=>Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:0});
const fCRC={format:v=>{const n=Math.round(Number(v)||0);return (n<0?"-₡":"₡")+miles(n)}};
const fUSD=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
function money(v,cur){return cur==="USD"?fUSD.format(v):fCRC.format(v)}
function short(v){const a=Math.abs(v),s=v<0?"-":"";if(a>=1e6)return s+"₡"+(a/1e6).toFixed(a>=1e7?0:1)+" M";if(a>=1e3)return s+"₡"+miles(a/1e3)+" k";return fCRC.format(v)}
function monthLabel(k){const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("es-CR",{month:"long",year:"numeric"})}
function monthShort(k){const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("es-CR",{month:"short",year:"2-digit"}).replace(".","")}
function num(s){return parseFloat(String(s).replace(/,/g,""))||0}
function mKey(m){return String(m||"").toUpperCase().replace(/\b\S*\d\S*\b/g," ").replace(/[^A-ZÁÉÍÓÚÑ&*.\/ ]/g," ").replace(/\s+/g," ").trim()}
function allTxns(){return Object.values(months).flatMap(m=>Object.values(m.txns||{}))}
function knownIds(){const s=new Set(settings.skipped||[]);for(const t of allTxns())s.add(t.id);return s}
function toCRC(v,cur){return cur==="USD"?v*(Number(settings.fx)||0):v}
function autoCat(t){
  const hay=t.kind==="sinpe"?((t.concept||"")+" "+(t.merchant||"")).toUpperCase():(t.merchant||"").toUpperCase();
  for(const[id,re]of RULES)if(re.test(hay))return id;
  return t.kind==="sinpe"?"transfer":"other";
}
function catOf(t){return t.catManual||settings.rules[mKey(t.merchant)]||autoCat(t)}
function srcKey(t){return t.income?String(t.kind==="sinpe"?(t.concept||"SINPE recibido"):t.merchant).toUpperCase().trim():mKey(t.merchant)}
function excluded(t){return !!t.exclude||!!(settings.excludeKeys||{})[srcKey(t)]}
function isSpend(t){return !excluded(t)&&!t.income&&!(t.own&&!settings.includeOwn)}
function isIncome(t){return !!t.income&&!excluded(t)}
function spendCRC(t){const v=toCRC(t.amount,t.currency);return t.refund?-v:v}
const chev=`<svg class="chev" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>`;

/* ===== Salario ===== */
// Cada cuánto le pagan a uno, llevado a meses.
const FREQ={mensual:1,quincenal:2,catorcenal:26/12,semanal:52/12};
const FREQ_NOM={mensual:"Cada mes",quincenal:"Cada quincena",catorcenal:"Cada 14 días",semanal:"Cada semana"};
const TIPO_ING={planilla:"Planilla",independiente:"Servicios profesionales",alquiler:"Alquiler",
  inversion:"Inversión o fideicomiso",negocio:"Negocio propio",otro:"Otro"};
function porMes(monto,freq){return (Number(monto)||0)*(FREQ[freq]||1)}
function extraNeto(){
  return (settings.extraIncomes||[]).filter(x=>x.activo!==false).reduce((s,x)=>s+porMes(x.monto,x.freq),0);
}

const TRAMOS=[[918000,0],[1347000,.10],[2364000,.15],[4727000,.20],[Infinity,.25]];
function isrMensual(base){let prev=0,tax=0;for(const[top,rate]of TRAMOS){if(base<=prev)break;tax+=(Math.min(base,top)-prev)*rate;prev=top}return tax}
function dedMonto(c,g){
  const v=Number(c.value)||0;
  if(c.type==="pct")return g*v/100;
  return c.cur==="usd"?v*(Number(settings?.fx)||460):v;
}
function salaryCalc(s){
  const g=Number(s.gross)||0;
  // Fuera de planilla no hay cuota obrera ni retención de renta en la fuente:
  // lo que la persona dice que recibe ya es neto.
  if(s.tipo&&s.tipo!=="planilla"){
    const cus=(s.custom||[]).map(c=>({name:c.name||"Deducción",pre:!!c.pre,amount:dedMonto(c,g)}));
    const ot=cus.reduce((a,b)=>a+b.amount,0);
    return {g,sem:0,ivm:0,bp:0,ccss:0,isr:0,base:g,custom:cus,otros:ot,net:Math.max(0,g-ot)};
  }
  const sem=g*(Number(s.rates.sem)||0)/100,ivm=g*(Number(s.rates.ivm)||0)/100,bp=g*(Number(s.rates.bp)||0)/100;
  const ccss=sem+ivm+bp;
  const custom=(s.custom||[]).map(c=>({name:c.name||"Deducción",pre:!!c.pre,amount:dedMonto(c,g)}));
  const otros=custom.reduce((a,b)=>a+b.amount,0);
  // Lo que sale antes de impuestos baja la base sobre la que se calcula la renta
  const pre=custom.filter(c=>c.pre).reduce((a,b)=>a+b.amount,0);
  const base=Math.max(0,(s.isrOnGross?g:Math.max(0,g-ccss))-pre);
  const isr=Math.max(0,isrMensual(base)-(Number(s.credits)||0));
  return {g,sem,ivm,bp,ccss,isr,base,pre,custom,otros,net:Math.max(0,g-ccss-isr-otros)};
}
function salaryIncome(){const s=settings.salary;const base=(s&&Number(s.gross)>0&&s.active!==false)?salaryCalc(s).net:0;return base+extraNeto()}
function migrate(){
  const s=settings.salary;
  if(s.gross>0&&!s.active&&!s.activeSet)s.active=true;
  if(!s.tipo)s.tipo="planilla";
  if(!s.freq)s.freq="mensual";
  // quien ya tenía un bruto mensual guardado arranca con pago mensual
  if(!s.grossPer&&s.gross>0){s.grossPer=s.gross;s.freq="mensual"}
  if(!Array.isArray(settings.people))settings.people=[];
  if(!Array.isArray(settings.extraIncomes))settings.extraIncomes=[];
}

/* ===== Gastos fijos ===== */
function recurring(){
  const ks=closedMonths().slice(0,3);
  if(ks.length<2)return [];
  const map={};
  for(const k of ks)for(const t of monthTxns(k).filter(isSpend)){
    const key=mKey(t.merchant)||t.merchant;if(!key)continue;
    map[key]=map[key]||{name:t.merchant,months:new Set(),total:0,cat:catOf(t)};
    map[key].months.add(k);map[key].total+=spendCRC(t);
  }
  return Object.entries(map).filter(([,v])=>v.months.size>=2)
    .map(([key,v])=>({key,name:v.name,cat:v.cat,avg:v.total/v.months.size,n:v.months.size}))
    .sort((a,b)=>b.avg-a.avg);
}
function incomeSources(k){
  const txns=monthTxns(k).filter(t=>t.income&&!t.exclude);
  const map={};
  for(const t of txns){
    const label=t.kind==="sinpe"?(t.concept?t.concept:"SINPE recibido"):t.merchant;
    const key=label.toUpperCase().trim();
    map[key]=map[key]||{label,key,amount:0,n:0,ids:[],kind:t.kind};
    map[key].amount+=toCRC(t.amount,t.currency);map[key].n++;map[key].ids.push(t.id);
  }
  const list=Object.values(map).map(x=>({...x,off:!!(settings.excludeKeys||{})[x.key]})).sort((a,b)=>b.amount-a.amount);
  if(salaryIncome())list.unshift({label:settings.salary.label||"Salario neto",amount:salaryIncome(),n:1,salary:true,ids:[]});
  return list;
}
function metodo(t){
  if(t.kind==="card")return t.card||"Tarjeta";
  if(t.kind==="sinpe")return t.income?"SINPE recibido":(t.own?"Entre cuentas":"SINPE");
  return "Manual";
}
function porMetodo(k){
  const map={};
  for(const t of monthTxns(k).filter(isSpend)){const m=metodo(t);map[m]=map[m]||{m,total:0,n:0};map[m].total+=spendCRC(t);map[m].n++}
  return Object.values(map).sort((a,b)=>b.total-a.total);
}
function aguinaldo(){const g=Number(settings.salary.gross)||0;return g}
function salarioEscolar(){const s=settings.salary;return s.escolar?(Number(s.gross)||0)*12*0.0819:0}
function ingresoAnual(){return salaryIncome()*12+aguinaldo()+salarioEscolar()}
function colchon(){
  const fijos=recurring().reduce((s,x)=>s+x.avg,0);
  const base=fijos>0?fijos:avgSpend();
  const saldo=Number(settings.proj.saldo)||0;
  return {base,saldo,meses:base>0?saldo/base:0,falta3:Math.max(0,base*3-saldo),falta6:Math.max(0,base*6-saldo)};
}
function savingsRate(){const i=avgIncome();return i>0?(i-avgSpend())/i*100:0}


/* ===== Análisis: hallazgos del mes ===== */
// Todo esto es aritmética sobre tus propios movimientos. Corre en el
// teléfono, sin mandar nada a ningún lado y sin costo por consulta.
const HORMIGA_DEF = 5000;          // colones: por debajo de esto es "hormiga"
function hormigaMax(){ return Number(settings.hormigaMax) || HORMIGA_DEF }

function agrupar(txns){
  const map={};
  for(const t of txns){
    const key=mKey(t.merchant)||t.merchant;if(!key)continue;
    map[key]=map[key]||{key,name:t.merchant,total:0,n:0,cat:catOf(t),montos:[]};
    map[key].total+=spendCRC(t);map[key].n++;map[key].montos.push(toCRC(t.amount,t.currency));
  }
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function hallazgos(){
  const out=[];
  const txns=monthTxns().filter(isSpend);
  const cerrados=closedMonths().slice(0,3);
  if(!txns.length)return out;

  // 1. GASTOS HORMIGA: compras chicas que de una en una no duelen
  const tope=hormigaMax();
  const small=txns.filter(t=>toCRC(t.amount,t.currency)<=tope);
  const totalSmall=small.reduce((s,t)=>s+spendCRC(t),0);
  const spendMes=txns.reduce((s,t)=>s+spendCRC(t),0);
  if(small.length>=4&&totalSmall>0){
    const top=agrupar(small).slice(0,4);
    out.push({
      id:"hormiga",tipo:"hormiga",color:"var(--orange)",
      titulo:"Gastos hormiga",
      monto:totalSmall,
      linea:`${small.length} compras de menos de ${fCRC.format(tope)}, el ${Math.round(totalSmall/(spendMes||1)*100)}% de lo que gastaste`,
      detalle:`Al año, a este ritmo, son ${fCRC.format(totalSmall*12)}`,
      items:top.map(x=>({nombre:x.name,n:x.n,monto:x.total}))
    });
  }

  // 2. SUSCRIPCIONES: mismo comercio, monto parejo, varios meses
  // las categorías de monto variable (súper, restaurantes, compras) no son
  // suscripciones aunque el monto se parezca mes a mes
  const VARIABLES=new Set(["super","rest","deliv","shop","fun","trans"]);
  const subs=recurring().filter(r=>r.n>=2&&!VARIABLES.has(r.cat)).map(r=>{
    const montos=[];
    for(const k of cerrados)for(const t of monthTxns(k).filter(isSpend))
      if((mKey(t.merchant)||t.merchant)===r.key)montos.push(toCRC(t.amount,t.currency));
    const prom=montos.reduce((a,b)=>a+b,0)/(montos.length||1);
    const disp=montos.length>1?Math.max(...montos)-Math.min(...montos):0;
    return {...r,prom,estable:prom>0&&disp/prom<0.05};
  }).filter(x=>x.estable);
  if(subs.length){
    const tot=subs.reduce((s,x)=>s+x.avg,0);
    out.push({
      id:"subs",tipo:"subs",color:"var(--blue)",
      titulo:"Cobros fijos cada mes",
      monto:tot,
      linea:`${subs.length} comercios te cobran casi el mismo monto todos los meses`,
      detalle:`Son ${fCRC.format(tot*12)} al año comprometidos`,
      items:subs.slice(0,6).map(x=>({nombre:x.name,n:x.n,monto:x.avg}))
    });
  }

  // 3. SUBIDAS DE PRECIO: un recurrente que este mes cobró más
  const subidas=[];
  for(const r of recurring()){
    const hoy=agrupar(txns).find(x=>x.key===r.key);
    if(!hoy||r.avg<=0)continue;
    const delta=hoy.total-r.avg;
    if(delta>Math.max(500,r.avg*0.15))subidas.push({nombre:hoy.name,antes:r.avg,ahora:hoy.total,delta});
  }
  if(subidas.length){
    const tot=subidas.reduce((s,x)=>s+x.delta,0);
    out.push({
      id:"subidas",tipo:"subidas",color:"var(--red)",
      titulo:"Te subieron el precio",
      monto:tot,
      linea:`${subidas.length} ${subidas.length===1?"comercio cobra":"comercios cobran"} más que su promedio`,
      detalle:`Si se queda así, son ${fCRC.format(tot*12)} más al año`,
      items:subidas.slice(0,5).map(x=>({nombre:x.nombre,n:0,monto:x.delta,nota:`de ${fCRC.format(x.antes)} a ${fCRC.format(x.ahora)}`}))
    });
  }

  // 4. POSIBLES COBROS DUPLICADOS
  const dup={};
  for(const t of txns){
    const k=(mKey(t.merchant)||t.merchant)+"|"+t.amount+"|"+t.ts.slice(0,10);
    dup[k]=dup[k]||{name:t.merchant,amount:toCRC(t.amount,t.currency),fecha:t.ts.slice(0,10),n:0};
    dup[k].n++;
  }
  const dobles=Object.values(dup).filter(x=>x.n>1);
  if(dobles.length){
    const tot=dobles.reduce((s,x)=>s+x.amount*(x.n-1),0);
    out.push({
      id:"dup",tipo:"dup",color:"var(--red)",
      titulo:"Posibles cobros repetidos",
      monto:tot,
      linea:`${dobles.length} ${dobles.length===1?"cobro idéntico el mismo día":"cobros idénticos el mismo día"}`,
      detalle:"Puede ser normal, pero vale la pena revisarlo con el banco",
      items:dobles.slice(0,5).map(x=>({nombre:x.name,n:x.n,monto:x.amount*(x.n-1)}))
    });
  }

  // 5. COMERCIOS NUEVOS este mes
  if(cerrados.length){
    const vistos=new Set();
    for(const k of cerrados)for(const t of monthTxns(k).filter(isSpend))vistos.add(mKey(t.merchant)||t.merchant);
    const nuevos=agrupar(txns).filter(x=>!vistos.has(x.key)&&x.total>0);
    if(nuevos.length){
      const tot=nuevos.reduce((s,x)=>s+x.total,0);
      out.push({
        id:"nuevos",tipo:"nuevos",color:"var(--label2)",
        titulo:"Comercios nuevos",
        monto:tot,
        linea:`${nuevos.length} lugares donde no habías comprado en los últimos meses`,
        detalle:"",
        items:nuevos.slice(0,5).map(x=>({nombre:x.name,n:x.n,monto:x.total}))
      });
    }
  }
  return out;
}
function totalHormiga(){
  const tope=hormigaMax();
  return monthTxns().filter(isSpend).filter(t=>toCRC(t.amount,t.currency)<=tope)
    .reduce((s,t)=>s+spendCRC(t),0);
}

/* ===== Cifras del mes ===== */
function monthTxns(k){return Object.values(months[k||current]?.txns||{}).sort((a,b)=>b.ts.localeCompare(a.ts))}
function figures(k){
  const txns=monthTxns(k);
  const spend=txns.filter(isSpend).reduce((s,t)=>s+spendCRC(t),0);
  const inc=txns.filter(isIncome).reduce((s,t)=>s+toCRC(t.amount,t.currency),0)+salaryIncome();
  const byCat={};for(const t of txns.filter(isSpend)){const c=catOf(t);byCat[c]=(byCat[c]||0)+spendCRC(t)}
  return {txns,spend,inc,queda:inc-spend,cats:Object.entries(byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])};
}
function closedMonths(){
  const now=ymKey(new Date());
  return Object.keys(months).filter(k=>k<now&&monthTxns(k).some(isSpend)).sort().reverse();
}
function avgSpend(){
  const ks=closedMonths().slice(0,3);
  if(!ks.length)return figures().spend;
  return ks.reduce((s,k)=>s+figures(k).spend,0)/ks.length;
}
function avgIncome(){
  const ks=closedMonths().slice(0,3);
  const extra=ks.length?ks.reduce((s,k)=>s+monthTxns(k).filter(isIncome).reduce((a,t)=>a+toCRC(t.amount,t.currency),0),0)/ks.length:
    monthTxns().filter(isIncome).reduce((a,t)=>a+toCRC(t.amount,t.currency),0);
  return salaryIncome()+extra;
}
function paceEndOfMonth(){
  if(current!==ymKey(new Date()))return null;
  const now=new Date(),day=now.getDate(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const f=figures();
  if(day<3||!f.spend)return null;
  return f.spend/day*dim;
}

/* ===== Proyección ===== */
function projInputs(){
  const p=settings.proj;
  const aporte=p.aporte===null||p.aporte===undefined?Math.max(0,Math.round(avgIncome()-avgSpend())):Number(p.aporte)||0;
  return {saldo:Number(p.saldo)||0,aporte,rate:Number(p.rate)||0,plazo:Number(p.plazo)||12,meta:Number(p.meta)||0};
}
function projSeries(){
  const{saldo,aporte,rate,plazo}=projInputs();
  const r=Math.pow(1+rate/100,1/12)-1;
  const con=[saldo],sin=[saldo];
  const extra13=settings.proj.usaAguinaldo?aguinaldo()+salarioEscolar():0;
  let b=saldo,s=saldo,total=0;
  const hoy=new Date();
  for(let i=1;i<=plazo;i++){
    const mes=(hoy.getMonth()+i)%12;
    const bono=extra13?((mes===11?aguinaldo():0)+(mes===0?salarioEscolar():0)):0;
    b=b*(1+r)+aporte+bono;s=s+aporte+bono;total+=aporte+bono;
    con.push(b);sin.push(s);
  }
  return {con,sin,aportado:total,final:con[con.length-1],interes:con[con.length-1]-saldo-total};
}
function mesesParaMeta(){
  const{saldo,aporte,rate,meta}=projInputs();
  if(!meta||meta<=saldo)return meta?0:null;
  if(aporte<=0&&rate<=0)return null;
  const r=Math.pow(1+rate/100,1/12)-1;
  let b=saldo;
  for(let i=1;i<=600;i++){b=b*(1+r)+aporte;if(b>=meta)return i}
  return null;
}
function chartSVG(con,sin){
  const W=320,H=150,P=6;
  const max=Math.max(...con,1),min=Math.min(...con,...sin,0);
  const x=i=>P+(i/(con.length-1||1))*(W-P*2);
  const y=v=>H-P-((v-min)/((max-min)||1))*(H-P*2);
  const line=a=>a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const area=`${line(con)} L${x(con.length-1).toFixed(1)} ${H-P} L${x(0).toFixed(1)} ${H-P} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" style="height:150px">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--blue)" stop-opacity=".28"/><stop offset="100%" stop-color="var(--blue)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g)"/>
    <path d="${line(sin)}" fill="none" stroke="var(--label3)" stroke-width="1.6" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <path d="${line(con)}" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

/* ===== Deudas ===== */
function debtRun(d,extra){
  const B0=Number(d.balance)||0,r=(Number(d.rate)||0)/100/12,P=(Number(d.payment)||0)+(extra||0);
  if(B0<=0)return {months:0,interest:0,total:0,done:true};
  if(P<=B0*r+0.01)return {never:true,months:null,interest:null,total:null};
  let B=B0,i=0,int=0;
  while(B>0&&i<1200){const ib=B*r;int+=ib;B=B+ib-P;i++;if(B<0)B=0}
  return {months:i,interest:int,total:B0+int,never:false};
}
function debtCalc(d){
  const con=debtRun(d,Number(d.extra)||0),sin=debtRun(d,0);
  return {...con,base:sin,ahorro:(!con.never&&!sin.never&&d.extra>0)?sin.interest-con.interest:0,mesesMenos:(!con.never&&!sin.never&&d.extra>0)?sin.months-con.months:0};
}
function debtTotals(){
  const ds=settings.debts||[];
  let saldo=0,cuota=0,interes=0,maxMes=0,alguno=false,nunca=false;
  for(const d of ds){
    const c=debtCalc(d),f=d.currency==="USD"?(Number(settings.fx)||0):1;
    saldo+=(Number(d.balance)||0)*f;cuota+=((Number(d.payment)||0)+(Number(d.extra)||0))*f;
    if(c.never)nunca=true;else{interes+=(c.interest||0)*f;maxMes=Math.max(maxMes,c.months||0);alguno=true}
  }
  return {saldo,cuota,interes,maxMes,alguno,nunca,n:ds.length};
}
function enMeses(n){const d=new Date();d.setMonth(d.getMonth()+n);return d.toLocaleDateString("es-CR",{month:"long",year:"numeric"})}

/* ===== Parseo BAC ===== */
const MES={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,SET:9,OCT:10,NOV:11,DIC:12};
function isoFromEmail(d){const x=new Date(d);return isNaN(x)?null:`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`}
function parseCard(msg){
  const body=msg.plaintextBody||msg.snippet||"";
  const map={};
  for(const raw of body.split("\n")){
    const line=raw.replace(/\|/g," ").replace(/\s+/g," ").trim();
    const m=line.match(/^([A-Za-zÁÉÍÓÚáéíóúñÑ ]{3,40}):\s*(.+)$/);
    if(m)map[m[1].trim().toLowerCase()]=m[2].trim();
  }
  const holderM=body.replace(/[|#]/g," ").replace(/\s+/g," ").match(/Hola\s+(.+?)\s+A continuaci/i);
  const montoRaw=map["monto"];if(!montoRaw)return null;
  const mm=montoRaw.match(/(USD|CRC|\$|₡|[A-Z]{3})\s*([\d.,]+)/);if(!mm)return null;
  const currency=/USD|\$/.test(mm[1])?"USD":(mm[1]==="CRC"||mm[1]==="₡"?"CRC":mm[1]);
  let ts=null;
  const f=(map["fecha"]||"").match(/([A-Za-z]{3})\w*\.?\s+(\d{1,2}),?\s*(\d{4})\s*,?\s*(\d{1,2}):(\d{2})/);
  if(f&&MES[f[1].toUpperCase()])ts=`${f[3]}-${pad(MES[f[1].toUpperCase()])}-${pad(f[2])}T${pad(f[4])}:${f[5]}`;
  ts=ts||isoFromEmail(msg.date);
  let card="";
  for(const k of Object.keys(map))if(/^(master|visa|amex|american express|mastercard|tarjeta)/.test(k)){const d=map[k].match(/(\d{4})\s*$/);card=k.split(" ")[0].toUpperCase()+(d?" ••"+d[1]:"");break}
  const tipo=(map["tipo de transacción"]||map["tipo de transaccion"]||"").toUpperCase();
  return {id:msg.id,kind:"card",ts,merchant:map["comercio"]||(msg.subject||"").replace(/Notificaci.n de transacci.n/i,"").trim(),
    place:map["ciudad y país"]||map["ciudad y pais"]||"",amount:num(mm[2]),currency,card,tipo,
    refund:/DEVOL|REVERS|ANUL|CR[EÉ]DITO|REEMBOLSO/.test(tipo),
    auth:map["autorización"]||map["autorizacion"]||"",ref:map["referencia"]||"",
    holder:holderM?holderM[1].trim():""};
}
function parseSinpe(msg){
  const t=(msg.plaintextBody||msg.snippet||"").replace(/[|]/g," ").replace(/\s+/g," ");
  const a=t.match(/monto de\s*([\d.,]+)\s*(D[oó]lares|Colones|USD|CRC)/i);if(!a)return null;
  const currency=/d[oó]lar|usd/i.test(a[2])?"USD":"CRC";
  const who=(t.match(/Hola:?\s*([^:]+?)\s*:/i)||[])[1]||"";
  const concept=((t.match(/por concepto de\s*(.+?)\.\s/i)||[])[1]||"").replace(/_+/g," ").trim();
  const d=t.match(/el (?:d[ií]a )?(\d{1,2})\/(\d{1,2})\/(\d{4}) a las (\d{1,2}):(\d{2})(?::\d{2})?\s*(a\.?\s?m\.?|p\.?\s?m\.?)?/i);
  let ts=null;
  if(d){let h=+d[4];const ap=(d[6]||"").toLowerCase().replace(/[\s.]/g,"");if(ap){const pm=ap.charAt(0)==="p";if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}ts=`${d[3]}-${pad(d[2])}-${pad(d[1])}T${pad(h)}:${d[5]}`}
  ts=ts||isoFromEmail(msg.date);
  const credit=/acreditando|recibi[oó]|ha recibido/i.test(t);
  const whoClean=who.replace(/_+/g," ").trim();
  if(credit)return {id:msg.id,kind:"sinpe",ts,merchant:"Ingreso SINPE"+(concept?": "+concept:""),beneficiary:"",concept,amount:num(a[1]),currency,income:true,own:false,refund:false};
  return {id:msg.id,kind:"sinpe",ts,merchant:whoClean?"SINPE a "+whoClean:"Transferencia SINPE",beneficiary:whoClean,concept,amount:num(a[1]),currency,income:false,refund:false};
}
function isOwnName(name){
  const h=(settings.holder||"").toUpperCase().split(/\s+/).filter(w=>w.length>2);
  const n=String(name||"").toUpperCase().split(/\s+/).filter(w=>w.length>2);
  if(h.length<2||!n.length)return false;
  return n.filter(w=>h.includes(w)).length>=2;
}

const ERR={
  needs_reauth:"Tu conexión de Gmail expiró. Reconectala en claude.ai, en Ajustes, Conectores.",
  server_not_connected:"Gmail no está conectado. Agregalo en claude.ai, en Ajustes, Conectores.",

function payloadOf(r){let p=r?.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}return p||{}}
async function read(mcp,tool,input){
  try{return payloadOf(await mcp.callTool("Gmail",tool,input,{cache:false}))}
  catch(e){
    if(e?.retryable){await new Promise(r=>setTimeout(r,(e.retryAfterMs||800)+Math.random()*600));return payloadOf(await mcp.callTool("Gmail",tool,input,{cache:false}))}
    throw e;
  }
}
function sinceDate(n){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(n-1));return `${d.getFullYear()}/${pad(d.getMonth()+1)}/01`}
async function sync(){
  if(syncing)return;
  if(!caps.mcp){toast("Esta vista no puede leer Gmail. Abrila desde claude.ai o la app de Claude.",true);return}
  syncing=true;render();
  const mcp=caps.mcp;
  const q=`from:baccredomatic.cr {subject:transacción subject:transaccion subject:transferencia} after:${sinceDate(Number(settings.monthsBack)||5)}`;
  toast("Buscando correos de BAC…");
  const known=knownIds(),todo=[];
  try{
    let token=null,pages=0;
    do{
      const p=await read(mcp,"search_threads",token?{query:q,pageSize:50,pageToken:token}:{query:q,pageSize:50});
      for(const th of p.threads||[])for(const m of th.messages||[]){
        if(known.has(m.id)||todo.some(x=>x.id===m.id))continue;
        const s=m.subject||"";
        if(/transacci/i.test(s))todo.push({id:m.id,type:"card"});
        else if(/transferencia/i.test(s))todo.push({id:m.id,type:"sinpe"});
      }
      token=p.nextPageToken||null;pages++;
    }while(token&&pages<25);
  }catch(e){return failSync(e)}
  if(!todo.length){settings.lastSync=new Date().toISOString();await saveSettings();syncing=false;toast("Todo al día.");render();return}
  let done=0,added=0,failed=0,fatal=null;const dirty=new Set();
  const tick=()=>toast(`Leyendo movimientos, ${done} de ${todo.length}`,false,done/todo.length);
  tick();
  const queue=todo.slice();
  async function worker(){
    while(queue.length&&!fatal){
      const job=queue.shift();
      try{
        const msg=await read(mcp,"get_message",{messageId:job.id,messageFormat:"PLAIN_TEXT"});
        const t=job.type==="card"?parseCard(msg):parseSinpe(msg);
        if(!t||!t.ts)settings.skipped.push(job.id);
        else{
          if(t.kind==="card"&&t.holder&&!settings.holder)settings.holder=t.holder;
          delete t.holder;
          const k=t.ts.slice(0,7);
          months[k]=months[k]||{txns:{}};
          const dup=t.kind==="card"&&t.auth&&Object.values(months[k].txns).some(x=>x.auth===t.auth&&x.ref===t.ref&&x.amount===t.amount);
          if(dup)settings.skipped.push(job.id);
          else{months[k].txns[t.id]=t;dirty.add(k);added++}
        }
      }catch(e){
        if(["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy","not_granted","capability_disabled","consent_required","selection_required","approval_required"].includes(e?.code))fatal=e;
        else failed++;
      }
      done++;tick();
      if(done%25===0&&dirty.size){const ks=[...dirty];dirty.clear();await saveMonths(ks)}
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  for(const t of allTxns())if(t.kind==="sinpe"&&!t.income){const own=isOwnName(t.beneficiary);if(own!==!!t.own){t.own=own;dirty.add(t.ts.slice(0,7))}}
  if(dirty.size)await saveMonths([...dirty]);
  settings.lastSync=new Date().toISOString();await saveSettings();
  syncing=false;
  if(fatal)return failSync(fatal,added);
  if(!months[current]){const ks=Object.keys(months).sort();if(ks.length)current=ks[ks.length-1]}
  toast(`Listo, ${added} movimientos nuevos${failed?`, ${failed} correos no se pudieron leer`:""}.`);
  render();
}
function failSync(e,added){
  syncing=false;
  toast((added?`Se guardaron ${added} movimientos. `:"")+(ERR[e?.code]||"Error leyendo Gmail."),true);
  render();
}
async function aiClassify(){

  try{

other = si de verdad no se puede saber

function viewDeudas(){
  const ds=settings.debts||[],t=debtTotals();
  let h=navBar("Deudas",ds.length?`${ds.length} ${ds.length===1?"deuda":"deudas"} activas`:"Tarjetas, préstamos, hipoteca",
    `<button class="round" data-act="addDebt" aria-label="Agregar deuda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>`);
  if(!ds.length)return h+`<div class="blank"><p>Agregá una deuda con su saldo, tasa y cuota, y calculo cuándo queda cancelada y cuántos intereses vas a pagar.</p><button class="btn" data-act="addDebt">Agregar deuda</button></div>`;
  h+=`<div class="widget">
    <div class="wtop"><span>Debés en total</span><span>${esc(fCRC.format(t.cuota))} al mes</span></div>
    <div class="money">${esc(fCRC.format(t.saldo))}</div>
    <div class="sub">${t.nunca?"Hay una deuda cuya cuota no cubre ni los intereses":t.alguno?`libre de deudas en ${t.maxMes} meses, ${esc(enMeses(t.maxMes))}`:"sin saldo pendiente"}</div>
    ${t.alguno?`<div class="pair"><div><span>Intereses por pagar</span><b style="color:var(--red)">${esc(short(t.interes))}</b></div><div><span>Total a pagar</span><b>${esc(short(t.saldo+t.interes))}</b></div></div>`:""}
  </div>`;
  const orden=[...ds].sort((a,b)=>(Number(b.rate)||0)-(Number(a.rate)||0));
  h+=`<h2 class="sec">Tus deudas</h2><div class="group">`;
  h+=orden.map(d=>{
    const c=debtCalc(d);
    return `<button class="cell" data-debt="${esc(d.id)}">
      <span class="ic" style="background:${c.never?"var(--red)":"var(--label2)"}">${IC.deuda}</span>
      <span class="tx"><b>${esc(d.name||"Deuda")}</b><span>${(Number(d.rate)||0).toFixed(2)}% anual, cuota ${esc(money((Number(d.payment)||0)+(Number(d.extra)||0),d.currency))}</span></span>
      <span class="val">${esc(money(Number(d.balance)||0,d.currency))}<small>${c.never?"no baja":c.months?`${c.months} meses`:"cancelada"}</small></span>${chev}</button>`;
  }).join("")+`</div>`;
  if(orden.length>1&&!orden[0].never)h+=`<p class="note">Si te sobra plata para abonar, metela en ${esc(orden[0].name||"la primera")}: es la de tasa más alta, ${(Number(orden[0].rate)||0).toFixed(2)}% anual. Pagar de mayor a menor tasa es lo que menos intereses te cuesta.</p>`;
  const conExtra=ds.filter(d=>Number(d.extra)>0).map(d=>({d,c:debtCalc(d)})).filter(x=>x.c.ahorro>0);
  if(conExtra.length){
    h+=`<h2 class="sec">Lo que te ahorran tus abonos extra</h2><div class="group">`;
    h+=conExtra.map(x=>`<div class="cell compact"><span class="tx"><b>${esc(x.d.name)}</b><span>${x.c.mesesMenos} meses menos</span></span><span class="val in">${esc(short(x.c.ahorro*(x.d.currency==="USD"?(Number(settings.fx)||0):1)))}</span></div>`).join("")+`</div>`;
  }
  return h;
}

function viewWizard(){

  return `<div class="wiz">

function render(){
  const prevTab=$("#main").dataset.tab;
  const v=!settings.onboarded?viewWizard():tab==="inicio"?viewInicio():tab==="gastos"?viewGastos():tab==="salario"?viewSalario():tab==="proy"?viewProy():tab==="deudas"?viewDeudas():viewAjustes();
  const m=$("#main");
  m.innerHTML=`<div class="page">${v}</div>`;
  m.dataset.tab=tab;
  $("#hdrTitle").textContent=hdrTitle;
  if(prevTab!==tab)$("#scroll").scrollTop=0;
  onScroll();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  document.querySelector("nav.tabs").hidden=!settings.onboarded;
}

function openTx(id){
  $("#sheet").oninput=null;$("#sheet").onchange=null;
  let k=null,t=null;
  for(const kk in months)if(months[kk].txns?.[id]){k=kk;t=months[kk].txns[id];break}
  if(!t)return;
  let sel=catOf(t);const key=mKey(t.merchant);
  const s=$("#sheet");
  s.innerHTML=`<div class="grab"></div><h3>${esc(t.merchant)}</h3>
    <p class="sm">${esc(money(t.amount,t.currency))}${t.place?", "+esc(t.place):""}${t.concept?", "+esc(t.concept):""}</p>
    ${t.income?`<p class="sm">Cuenta como ingreso.</p>`:
    `<div class="opts">${CATS.map(c=>`<button class="opt" data-pick="${c.id}" aria-pressed="${sel===c.id}"><i style="background:${c.color}"></i>${esc(c.name)}</button>`).join("")}</div>
     <div class="group" style="margin-top:12px"><div class="cell"><label for="applyAll">Aplicar a todo este comercio</label><input type="checkbox" id="applyAll" ${key?"checked":""}></div>
     <div class="cell"><label for="exclude">No contar<em>Con la opción de arriba encendida, no cuenta ninguno de este comercio</em></label><input type="checkbox" id="exclude" ${t.exclude?"checked":""}></div></div>`}
    ${t.income?`<div class="group"><div class="cell"><label for="exclude">No contar este ingreso</label><input type="checkbox" id="exclude" ${t.exclude?"checked":""}></div></div>`:""}
    <div class="sheet-actions">${t.kind==="manual"?`<button class="btn destruct" data-del>Borrar</button>`:`<button class="btn quiet" data-close>Cancelar</button>`}<button class="btn" data-save>Guardar</button></div>`;
  s.onclick=async ev=>{
    const p=ev.target.closest("[data-pick]");
    if(p){sel=p.dataset.pick;s.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pick===sel));return}
    if(ev.target.closest("[data-close]"))return closeSheet();
    if(ev.target.closest("[data-del]")){delete months[k].txns[t.id];await saveMonths([k]);closeSheet();render();return}
    if(ev.target.closest("[data-save]")){
      t.exclude=$("#exclude").checked;
      if(!t.income){
        settings.excludeKeys=settings.excludeKeys||{};
        if($("#applyAll")?.checked&&key){
          settings.rules[key]=sel;delete t.catManual;
          if(t.exclude){settings.excludeKeys[key]=true;t.exclude=false}else delete settings.excludeKeys[key];
          await saveSettings();
        } else t.catManual=sel;
      }
      await saveMonths([k]);closeSheet();render();
    }
  };
  $("#dlg").showModal();
}

function openDebt(id){
  const ds=settings.debts||[];
  const d=id?ds.find(x=>x.id===id):{id:"d"+Math.random().toString(36).slice(2,8),name:"",balance:0,rate:0,payment:0,extra:0,currency:"CRC"};

    s.innerHTML=`<div class="grab"></div><h3>${nuevo?"Nueva deuda":esc(d.name||"Deuda")}</h3>
      <p class="sm">${c.never?"La cuota no cubre ni los intereses, el saldo nunca baja.":c.months?`Queda cancelada en ${c.months} ${c.months===1?"mes":"meses"}, ${esc(enMeses(c.months))}, con ${esc(money(c.interest,d.currency))} de intereses.`:"Poné saldo, tasa y cuota."}</p>

        <div class="cell"><label for="dExtra">Abono extra mensual<em>${c.ahorro>0?`te ahorra ${esc(money(c.ahorro,d.currency))} y ${c.mesesMenos} meses`:"opcional"}</em></label><input type="number" id="dExtra" min="0" step="1000" value="${d.extra||""}"></div>
      </div>
      <div class="sheet-actions">${nuevo?`<button class="btn quiet" data-close>Cancelar</button>`:`<button class="btn destruct" data-del>Borrar</button>`}<button class="btn" data-save>Guardar</button></div>`;
  };
  draw();
  s.oninput=ev=>{
    const el=ev.target;
    if(el.id==="dName")d.name=el.value;
    else if(el.id==="dBal")d.balance=Number(el.value)||0;
    else if(el.id==="dRate")d.rate=Number(el.value)||0;
    else if(el.id==="dPay")d.payment=Number(el.value)||0;
    else if(el.id==="dExtra")d.extra=Number(el.value)||0;

    if(ev.target.closest("[data-close]"))return closeSheet();
    if(ev.target.closest("[data-del]")){settings.debts=ds.filter(x=>x.id!==d.id);await saveSettings();closeSheet();render();return}

let timer=null;

document.addEventListener("click",async ev=>{
  const wz=ev.target.closest("[data-wiz]");
  if(wz){
    const v=wz.dataset.wiz;
    if(v==="skip"||v==="fin"){settings.onboarded=true;wiz=0;await saveSettings();render();$("#scroll").scrollTop=0;if(v==="fin"&&caps.mcp)sync();return}
    wiz=Math.max(0,Math.min(WIZ.length-1,wiz+Number(v)));await saveSettings();render();$("#scroll").scrollTop=0;return;
  }
  const dp=ev.target.closest("[data-del-person]");
  if(dp){settings.people.splice(+dp.dataset.delPerson,1);await saveSettings();render();return}
  const di=ev.target.closest("[data-del-inc]");
  if(di){settings.extraIncomes.splice(+di.dataset.delInc,1);await saveSettings();render();return}
  const tp=ev.target.closest("[data-tipo]");
  if(tp){const s=settings.salary;s.tipo=tp.dataset.tipo;s.gross=porMes(s.grossPer,s.freq);await saveSettings();render();return}
  const fq=ev.target.closest("[data-freq]");
  if(fq){const s=settings.salary;s.freq=fq.dataset.freq;s.gross=porMes(s.grossPer,s.freq);await saveSettings();render();return}
  const it=ev.target.closest("[data-itipo]");
  if(it){const[n,k]=it.dataset.itipo.split(":");settings.extraIncomes[+n].tipo=k;await saveSettings();render();return}
  const if_=ev.target.closest("[data-ifreq]");
  if(if_){const[n,k]=if_.dataset.ifreq.split(":");settings.extraIncomes[+n].freq=k;await saveSettings();render();return}
  const pz=ev.target.closest("[data-preset]");
  if(pz){settings.salary.custom=settings.salary.custom||[];
    settings.salary.custom.push({name:pz.dataset.preset,type:"pct",value:0,pre:false});
    await saveSettings();render();return}
  const du=ev.target.closest("[data-dedu]");
  if(du){const[i,t]=du.dataset.dedu.split(":"),d=settings.salary.custom[+i];
    d.type=t==="pct"?"pct":"amt";d.cur=t==="usd"?"usd":"crc";
    await saveSettings();render();return}
  const sv=ev.target.closest("[data-sav]");
  if(sv){settings.hasSav=sv.dataset.sav==="1";
    if(!settings.hasSav){settings.proj.saldo=0;settings.proj.rate=0}
    await saveSettings();render();return}
  const dbq=ev.target.closest("[data-deb]");
  if(dbq){settings.hasDebt=dbq.dataset.deb==="1";await saveSettings();render();return}
  const gl=ev.target.closest("[data-goal]");
  if(gl){const k=gl.dataset.goal,m=METAS.find(x=>x.k===k);
    settings.goal=settings.goal?.kind===k?null:{kind:k,label:m?m.t:"Estar tranquilo"};
    await saveSettings();render();return}
  const tb=ev.target.closest("nav.tabs button");
  if(tb){tab=tb.dataset.tab;filterCat=null;filterMet=null;filterSmall=false;query="";render();return}
  const go=ev.target.closest("[data-tab-go]");
  if(go){tab=go.dataset.tabGo;render();return}
  const m=ev.target.closest("[data-m]");if(m){current=m.dataset.m;render();return}
  const pl=ev.target.closest("[data-plazo]");
  if(pl){settings.proj.plazo=+pl.dataset.plazo;await saveSettings();render();return}
  const c=ev.target.closest("[data-cat]");
  if(c){const v=c.dataset.cat;filterCat=filterCat===v?null:v;render();return}
  const mt=ev.target.closest("[data-met]");
  if(mt){const v=mt.dataset.met;filterMet=filterMet===v?null:v;tab="gastos";render();return}
  const t=ev.target.closest("[data-tx]");if(t){openTx(t.dataset.tx);return}
  const sc=ev.target.closest("[data-src]");if(sc){openSource(sc.dataset.src);return}
  const db=ev.target.closest("[data-debt]");if(db){openDebt(db.dataset.debt);return}
  const dd=ev.target.closest("[data-del-ded]");
  if(dd){settings.salary.custom.splice(+dd.dataset.delDed,1);await saveSettings();render();return}
  const a=ev.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="sync")sync();
  else if(act==="verHormiga"){filterSmall=!filterSmall;filterCat=null;filterMet=null;tab="gastos";render();}
  else if(act==="hormigaCfg")openHormiga();
  else if(act==="addDebt")openDebt(null);
  else if(act==="rewiz"){settings.onboarded=false;wiz=0;await saveSettings();render()}
  else if(act==="probe"){
    probe=[{name:"Buscando…",detail:"",state:""}];render();
    try{
      const r=await caps.mcp.listTools();
      probe=(r.servers||[]).map(s=>({name:s.server||s.name||"servidor",
        state:s.authStatus||"",
        detail:(s.tools||[]).map(t=>t.name).filter(n=>/mail|message|thread|correo/i.test(n)).slice(0,4).join(", ")||`${(s.tools||[]).length} herramientas, ninguna de correo`}));
      if(!probe.length)probe=[{name:"Sin servidores",detail:"Esta vista solo tiene los conectores declarados por la app",state:""}];
    }catch(e){probe=[{name:"No se pudo consultar",detail:e?.code||"error",state:""}]}
    render();
  }
  else if(act==="ai")aiClassify();
  else if(act==="addIncome")openIncome();
  else if(act==="ajustes"){tab="ajustes";render()}
  else if(act==="autoAporte"){settings.proj.aporte=null;await saveSettings();render()}
  else if(act==="addPerson"){
    if((settings.people||[]).length>=2)return;
    settings.people.push({name:""});await saveSettings();render();
  }
  else if(act==="planGrande"){
    toast("Para hogares de cuatro o más vamos a tener un plan de Pacci aparte. Por ahora el plan llega a tres.");
    setTimeout(()=>{$("#toast").hidden=true},5200);
  }
  else if(act==="addInc"){
    settings.extraIncomes.push({label:"",monto:0,freq:"mensual",tipo:"alquiler",activo:true});
    await saveSettings();render();
  }
  else if(act==="addDed"){settings.salary.custom=settings.salary.custom||[];settings.salary.custom.push({name:"",type:"pct",value:0});await saveSettings();render()}
  else if(act==="wipe"){
    if(!confirm("¿Borrar todos los movimientos y reglas guardadas?"))return;
    if(store?.kind==="db")for(const k of Object.keys(months)){try{await store.root.collection("months").doc(k).delete()}catch(e){}}
    months={};const{salary,proj,fx,monthsBack}=settings;
    settings={...structuredClone(DEF),salary,proj,fx,monthsBack};
    await saveSettings();$("#toast").hidden=true;render();
  }
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="q"){query=el.value;const pos=el.selectionStart;render();const q2=$("#q");if(q2){q2.focus();q2.setSelectionRange(pos,pos)}return}
  if(el.id==="wName"){settings.name=el.value;queueSave();return}
  if(el.id==="gross"){settings.salary.gross=Number(el.value)||0;settings.salary.grossPer=porMes(el.value,settings.salary.freq)?Number(el.value)/(FREQ[settings.salary.freq]||1):0;queueSave();if(!settings.onboarded)return;repaintSalary();return}
  if(el.id==="grossPer"){const s=settings.salary;s.grossPer=Number(el.value)||0;s.gross=porMes(s.grossPer,s.freq);queueSave();repaintWiz();return}
  if(el.id==="diaPago"){settings.salary.dia=el.value;queueSave();return}
  if(el.dataset.person!==undefined){const p=settings.people[+el.dataset.person];if(p){p.name=el.value;queueSave()}return}
  if(el.dataset.inc!==undefined){
    const x=settings.extraIncomes[+el.dataset.inc];
    if(x){const k=el.dataset.ik;x[k]=k==="monto"?Number(el.value)||0:el.value;queueSave()}
    return;
  }
  if(el.id==="credits"){settings.salary.credits=Number(el.value)||0;queueSave();repaintSalary();return}
  if(el.dataset.rate){settings.salary.rates[el.dataset.rate]=Number(el.value)||0;queueSave();repaintSalary();return}
  if(el.dataset.ded!==undefined){const i=+el.dataset.ded,k=el.dataset.k;settings.salary.custom[i][k]=k==="value"?Number(el.value)||0:el.value;queueSave();if(k!=="name"){repaintSalary();repaintWiz()}return}
  if(el.id==="fx"){settings.fx=Math.max(1,Number(el.value)||settings.fx);queueSave();return}
  if(["pSaldo","pAporte","pRate","pMeta"].includes(el.id)){
    if(el.id==="pSaldo"&&Number(el.value)>0)settings.hasSav=true;
    const map={pSaldo:"saldo",pAporte:"aporte",pRate:"rate",pMeta:"meta"};
    settings.proj[map[el.id]]=el.value===""&&el.id==="pAporte"?null:Number(el.value)||0;
    queueSave();repaintProj();return;
  }
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.id==="salActive"){settings.salary.active=el.checked;settings.salary.activeSet=true;await saveSettings();render()}
  else if(el.id==="escolar"){settings.salary.escolar=el.checked;await saveSettings();render()}
  else if(el.id==="usaAgui"){settings.proj.usaAguinaldo=el.checked;await saveSettings();render()}
  else if(el.id==="isrGross"){settings.salary.isrOnGross=el.checked;await saveSettings();render()}
  else if(el.id==="own"){settings.includeOwn=el.checked;await saveSettings()}
  else if(el.id==="mb"){settings.monthsBack=Number(el.value)||5;await saveSettings()}
  else if(el.dataset.dedpre!==undefined){settings.salary.custom[+el.dataset.dedpre].pre=el.checked;await saveSettings();render()}
  else if(el.dataset.ded!==undefined&&el.dataset.k==="type"){settings.salary.custom[+el.dataset.ded].type=el.value;await saveSettings();render()}
});
function repaintWiz(){
  const pr=$("#main").querySelector(".wiz .pair");
  if(!pr)return;
  const c=salaryCalc(settings.salary),bs=pr.querySelectorAll("b");
  if(bs[0])bs[0].textContent=fCRC.format(settings.salary.gross||0);
  if(bs[1])bs[1].textContent=fCRC.format(c.net);
}
function repaintSalary(){
  if(tab!=="salario")return;
  const c=salaryCalc(settings.salary),neg=v=>"-"+fCRC.format(v);
  const vals=$("#main").querySelectorAll(".group .cell .val");
  if(vals[0])vals[0].textContent=neg(c.sem);
  if(vals[1])vals[1].textContent=neg(c.ivm);
  if(vals[2])vals[2].textContent=neg(c.bp);
  if(vals[3])vals[3].textContent=neg(c.isr);
  const w=$("#main").querySelector(".widget");
  if(w){w.querySelector(".money").textContent=fCRC.format(c.net);
    w.querySelector(".sub").textContent=`te rebajan ${fCRC.format(c.g-c.net)}${c.g?`, un ${((c.g-c.net)/c.g*100).toFixed(1)}% del bruto`:""}`}
}
function repaintProj(){
  if(tab!=="proy")return;
  const pi=projInputs(),p=projSeries(),w=$("#main").querySelector(".widget");
  if(!w)return;
  w.querySelector(".money").textContent=fCRC.format(p.final);
  w.querySelector(".wtop").firstElementChild.textContent=`En ${pi.plazo} meses tendrías`;
  w.querySelector(".wtop").lastElementChild.textContent=`${pi.rate}% anual`;
  const svg=w.querySelector("svg.chart");
  if(svg)svg.outerHTML=chartSVG(p.con,p.sin);
  const bs=w.querySelectorAll(".pair b");
  if(bs[0])bs[0].textContent=short(pi.saldo+p.aportado);
  if(bs[1])bs[1].textContent=short(p.interes);
}
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))closeSheet()});
$("#dlg").addEventListener("cancel",e=>{e.preventDefault();closeSheet()});

function onScroll(){
  const sc=$("#scroll");if(!sc)return;
  $("#hdr").classList.toggle("show",sc.scrollTop>46);
}
$("#scroll").addEventListener("scroll",onScroll,{passive:true});

/* ----- hojas que se arrastran para cerrar ----- */
function closeSheet(){
  const d=$("#dlg");if(!d.open)return;
  d.classList.add("closing");
  setTimeout(()=>{d.classList.remove("closing");d.close();d.style.transform=""},230);
}
(function dragSheet(){
  const d=$("#dlg");let y0=null,dy=0;
  d.addEventListener("pointerdown",e=>{
    const g=e.target.closest(".grab");if(!g)return;
    y0=e.clientY;dy=0;d.style.transition="none";g.setPointerCapture(e.pointerId);
  });
  d.addEventListener("pointermove",e=>{
    if(y0===null)return;
    dy=Math.max(0,e.clientY-y0);d.style.transform=`translateY(${dy}px)`;
  });
  d.addEventListener("pointerup",()=>{
    if(y0===null)return;
    d.style.transition="transform .25s cubic-bezier(.32,.72,0,1)";
    if(dy>90){d.style.transform="translateY(110%)";setTimeout(()=>{d.close();d.style.transform="";d.style.transition=""},230)}
    else d.style.transform="";
    y0=null;
  });
})();

/* ===== Arranque ===== */
render();
(async()=>{
  if(!window.claude?.use){await initStore();render();toast("Abrí esta app desde claude.ai o la app de Claude para conectar Gmail.",true);return}
  const[mcp,sample]=await Promise.all([window.claude.use("mcp"),window.claude.use("sample")]);
  caps.mcp=mcp;caps.sample=sample;
  await initStore();
  const ks=Object.keys(months).sort();
  if(ks.length&&!months[current])current=ks[ks.length-1];
  render();
  if(!mcp)toast("Esta vista no puede leer Gmail. Abrila desde claude.ai o la app de Claude.",true);
})();
})();
