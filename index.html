function diasParaCerrar(){
  const hoy=new Date(), fin=new Date(hoy.getFullYear(),hoy.getMonth()+1,0);
  return fin.getDate()-hoy.getDate()+1;
}
function seccionAporte(){
  const p=settings.proj, auto=p.aporte===null||p.aporte===undefined;
  const pi=projInputs(), s=sobraAlMes(), ks=mesesBase();
  const neto=salaryIncome();
  const metaPpal=(settings.goals||[])[0];
  const filas=[];
  let cuerpo="", leccion="", chips=[];

  if(s===null){
    /* Todavía no hay un mes completo: no inventamos un promedio */
    const d=diasParaCerrar();
    cuerpo=`<div class="aviso info" style="margin:0 2px 13px">
      <b>Todavía no puedo calcularlo por vos</b>
      <p>Para sacar tu promedio necesito al menos un mes cerrado de gastos. ${
        d<=7?`Este mes cierra en ${d} ${d===1?"día":"días"}.`:`Faltan ${d} días para que cierre.`} Mientras tanto, decime vos cuánto vas a apartar.</p></div>`;
    if(neto>0)chips=[
      {k:"p20",n:"20% de tu neto",v:Math.round(neto*.2)},
      {k:"p10",n:"10%",v:Math.round(neto*.1)},
      {k:"p5",n:"5%",v:Math.round(neto*.05)}
    ];
    leccion=neto>0
      ? `La regla más usada es apartar el <b>20% de lo que te queda después de rebajas</b>, o sea ${fCRC.format(neto*.2)} en tu caso, y hacerlo <b>el día que te pagan</b>, no al final del mes con lo que haya sobrado. Lo que sobra casi nunca sobra.`
      : `Poné tu salario en la pestaña de Salario y te puedo sugerir un monto con base en tu neto real.`;
  }
  else if(s<=0){
    /* Está gastando más de lo que entra */
    const cats=figures().cats.slice(0,3);
    cuerpo=`<div class="aviso alerta" style="margin:0 2px 13px">
      <b>Por ahora no hay nada que proyectar</b>
      <p>En promedio estás gastando ${fCRC.format(Math.abs(s))} más de lo que te entra. Antes de pensar en ahorrar hay que cerrar ese hueco.</p></div>
      ${cats.length?`<p class="mini">A dónde se fue este mes</p><div class="group">${cats.map(([k,v])=>`
        <div class="cell compact"><span class="dot" style="background:${CAT[k].color}">${CAT[k].ic}</span>
        <span class="tx"><b>${esc(CAT[k].name)}</b></span>
        <span class="val">${esc(fCRC.format(v))}</span></div>`).join("")}</div>`:""}`;
    leccion=`Ojo con el orden: recortar el gasto más grande suele rendir más que recortar diez chiquitos. Revisá <b>Gastos fijos</b>, que es donde se esconde la plata que sale todos los meses sin que la veás.`;
  }
  else{
    /* Hay promedio real: mostramos la resta */
    filas.push(["Ingreso promedio al mes",fCRC.format(avgIncome()),"in"]);
    filas.push([`Gasto promedio (${ks.length} ${ks.length===1?"mes":"meses"})`,"−"+fCRC.format(avgSpend()),""]);
    filas.push(["Te sobra",fCRC.format(s),"tot"]);
    chips=[
      {k:"todo",n:"Todo lo que sobra",v:Math.round(s)},
      {k:"mitad",n:"La mitad",v:Math.round(s/2)},
      {k:"tercio",n:"Un tercio",v:Math.round(s/3)}
    ];
    leccion=`Que te sobren ${fCRC.format(s)} no quiere decir que podás ahorrar ${fCRC.format(s)} <b>todos</b> los meses. Diciembre, el marchamo, el cumpleaños de alguien y cualquier imprevisto salen de ahí. Empezá por la mitad y subilo cuando veás que el mes aguanta.`;
  }

  const elegido=chips.find(c=>!auto&&Math.abs(c.v-pi.aporte)<1);
  const mesesMeta=metaPpal?(()=>{const g=aCRC(metaPpal.monto,metaPpal.cur);
    if(!g||pi.aporte<=0)return null;
    const r=pi.rate/100/12;let b=pi.saldo;
    for(let i=1;i<=600;i++){b=b*(1+r)+pi.aporte;if(b>=g)return i}
    return null;})():null;

  return `<h2 class="sec">Cuánto podés apartar</h2>
  ${cuerpo}
  ${filas.length?`<div class="resta">${filas.map(([a,b,c])=>`
    <div class="fil ${c}"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join("")}</div>`:""}
  ${chips.length?`<div class="chips" style="margin:13px 2px 0">${chips.map(c=>`
    <button class="chip" data-aporte="${c.k}:${c.v}" aria-pressed="${!!(elegido&&elegido.k===c.k)}">${esc(c.n)} · ${esc(fCRC.format(c.v))}</button>`).join("")}</div>`:""}
  <div class="group" style="margin-top:13px">
    <div class="cell"><label for="pAporte">Aporte mensual<em>${auto?(s===null?"Todavía sin definir":s<=0?"Sin margen por ahora":"Sugerido por Pacci"):"Fijado por vos"}</em></label>${inputMonto('id="pAporte"',pi.aporte||"")}</div>
    ${!auto&&s!==null?`<div class="cell"><label>Volver a la sugerencia de Pacci</label><button class="btn quiet sm" data-act="autoAporte">Automático</button></div>`:""}
  </div>
  ${leccion?`<div class="tip" style="margin:13px 2px 0">${IC_META.grafico}<p>${leccion}</p></div>`:""}
  ${metaPpal&&pi.aporte>0?`<div class="tip" style="margin:9px 2px 0;background:linear-gradient(135deg,rgba(23,181,131,.11),rgba(23,181,131,.04))">
    ${IC.check}<p>Con ${esc(fCRC.format(pi.aporte))} al mes, tu meta de <b style="color:var(--ink)">${esc(metaDe(metaPpal.kind).t).toLowerCase()}</b> ${
      mesesMeta?`llega en <b>${mesesMeta} ${mesesMeta===1?"mes":"meses"}</b>, ${esc(enMeses(mesesMeta))}.`:"queda muy lejos con este aporte. Probá subirlo o bajar el monto de la meta."}</p></div>`:""}`;
}

  </div>

  <h2 class="sec">De dónde salen los números</h2>

    <div class="cell"><label>Ingreso mensual promedio</label><span class="val in">${esc(fCRC.format(avgIncome()))}</span></div>

    <div class="cell"><label>Gastos fijos detectados<em>Comercios que se repiten mes a mes</em></label><span class="val">${esc(fCRC.format(recurring().reduce((s,x)=>s+x.avg,0)))}</span></div>
    <div class="cell"><label>Te sobra cada mes</label><span class="val${(sobraAlMes()??0)>=0?" in":""}">${sobraAlMes()===null?"—":esc(fCRC.format(sobraAlMes()))}</span></div>
    <div class="cell"><label>Cuotas de deuda<em>Si ya salen de tu cuenta, están dentro de los gastos</em></label><span class="val">${esc(fCRC.format(debtTotals().cuota))}</span></div>
    <div class="cell"><label>Tasa de ahorro<em>De cada ₡100 que entran</em></label><span class="val${(savingsRate()??0)>=0?" in":""}">${savingsRate()===null?"—":savingsRate().toFixed(0)+"%"}</span></div>
  </div>

  <h2 class="sec">Meta</h2>
  <div class="group">
    <div class="cell"><label for="pMeta">Monto que querés ahorrar</label>${inputMonto('id="pMeta"',pi.meta||"")}</div>
    ${pi.meta?`<div class="cell"><label>${meta===null?"Con este aporte no llegás":meta===0?"Ya la alcanzaste":"La alcanzás en"}</label><span class="val">${meta?`${meta} ${meta===1?"mes":"meses"}`:meta===0?"✓":"—"}</span></div>`:""}
  </div>
  <p class="note">La línea punteada es lo que tendrías sin rendimiento. El supuesto es aporte constante y rendimiento parejo, así que tomalo como escenario, no como promesa.</p>`;
}
function viewDeudas(){
  const ds=settings.debts||[],t=debtTotals();
  let h=navBar("Deudas",ds.length?`${ds.length} ${ds.length===1?"deuda":"deudas"} activas`:"Tarjetas, préstamos, hipoteca",
    `<button class="round" data-act="addDebt" aria-label="Agregar deuda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>`);
  if(!ds.length)return h+`<div class="blank"><p>Agregá una deuda con su saldo, tasa y cuota, y calculo cuándo queda cancelada y cuántos intereses vas a pagar.</p><button class="btn" data-act="addDebt">Agregar deuda</button></div>`;
  h+=`<div class="widget">
    <div class="wtop"><span>Debés en total</span><span>${esc(fCRC.format(t.cuota))} al mes</span></div>
    <div class="money">${esc(fCRC.format(t.saldo))}</div>
    <div class="sub">${t.nunca?"Hay una deuda cuya cuota no cubre ni los intereses":t.alguno?`libre de deudas en ${t.maxMes} meses, ${esc(enMeses(t.maxMes))}`:"sin saldo pendiente"}</div>
    ${t.alguno?`<div class="pair"><div><span>Intereses por pagar</span><b style="color:var(--red)">${esc(short(t.interes))}</b></div><div><span>Total a pagar</span><b>${esc(short(t.saldo+t.interes))}</b></div></div>`:""}
  </div>`;
  const orden=[...ds].sort((a,b)=>(Number(b.rate)||0)-(Number(a.rate)||0));
  h+=`<h2 class="sec">Tus deudas</h2><div class="group">`;
  h+=orden.map(d=>{
    const c=debtCalc(d);
    return `<button class="cell" data-debt="${esc(d.id)}">
      <span class="ic" style="background:${c.never?"var(--red)":"var(--label2)"}">${IC.deuda}</span>
      <span class="tx"><b>${esc(d.name||"Deuda")}</b><span>${(Number(d.rate)||0).toFixed(2)}% anual, cuota ${esc(money((Number(d.payment)||0)+(Number(d.extra)||0),d.currency))}</span></span>
      <span class="val">${esc(money(Number(d.balance)||0,d.currency))}<small>${c.never?"no baja":c.months?`${c.months} meses`:"cancelada"}</small></span>${chev}</button>`;
  }).join("")+`</div>`;
  if(orden.length>1&&!orden[0].never)h+=`<p class="note">Si te sobra plata para abonar, metela en ${esc(orden[0].name||"la primera")}: es la de tasa más alta, ${(Number(orden[0].rate)||0).toFixed(2)}% anual. Pagar de mayor a menor tasa es lo que menos intereses te cuesta.</p>`;
  const conExtra=ds.filter(d=>Number(d.extra)>0).map(d=>({d,c:debtCalc(d)})).filter(x=>x.c.ahorro>0);
  if(conExtra.length){
    h+=`<h2 class="sec">Lo que te ahorran tus abonos extra</h2><div class="group">`;
    h+=conExtra.map(x=>`<div class="cell compact"><span class="tx"><b>${esc(x.d.name)}</b><span>${x.c.mesesMenos} meses menos</span></span><span class="val in">${esc(short(x.c.ahorro*(x.d.currency==="USD"?(Number(settings.fx)||0):1)))}</span></div>`).join("")+`</div>`;
  }
  return h;
}

const IC_INTRO={
  cerrar:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg>`,
  flecha:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.5 15.5 12 9 18.5"/></svg>`,
  play:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.6 5.2a1 1 0 0 1 1.5-.9l8.4 5.8a1 1 0 0 1 0 1.7l-8.4 5.8a1 1 0 0 1-1.5-.9z"/></svg>`
};
// los números suben solos cuando la lámina aparece
function animarIntro(){
  document.querySelectorAll(".comofunciona [data-count]").forEach(el=>{
    const fin=Number(el.dataset.count)||0, t0=performance.now(), dur=1100, retraso=420;
    el.textContent=fCRC.format(0);
    const paso=now=>{
      const t=Math.min(1,Math.max(0,(now-t0-retraso)/dur));
      const e=1-Math.pow(1-t,3);
      el.textContent=fCRC.format(Math.round(fin*e));
      if(t<1&&document.body.contains(el))requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  });
}

function viewWizard(){
  const i=Math.max(0,Math.min(wiz,WIZ.length-1)), step=WIZ[i], ultimo=i>=WIZ.length-1;
  hdrTitle=step.t||"Pacci";
  if(i===0)return `<div class="wiz">${step.f()}</div>`;
  const total=WIZ.length-1;
  return `<div class="wiz">
    <div class="wiz-top">
      <span class="paso">Paso ${i} de ${total}</span>
      <button data-wiz="${ultimo?"fin":"1"}">${ultimo?"Hacerlo después":"Saltar esta"}</button>
    </div>
    <div class="prog">${Array.from({length:total},(_,n)=>
      `<i class="${n+1<i?"on":n+1===i?"now":""}"></i>`).join("")}</div>
    <h1>${esc(step.t)}</h1>
    ${step.s?`<p class="intro">${esc(step.s)}</p>`:""}
    ${step.f()}
    <div class="sheet-actions" style="margin:24px 0 0">
      <button class="btn quiet" data-wiz="-1">Atrás</button>
      <button class="btn" data-wiz="${ultimo?"fin":"1"}">${ultimo?"Conectar y entrar":"Siguiente"}</button>
    </div>
  </div>`;
}

    <p class="sm">${esc(money(t.amount,t.currency))}${t.place?", "+esc(t.place):""}${t.concept?", "+esc(t.concept):""}</p>
    ${t.income?`<p class="sm">Cuenta como ingreso.</p>`:

  s.onclick=async ev=>{
    const p=ev.target.closest("[data-pick]");
    if(p){sel=p.dataset.pick;s.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pick===sel));return}
    if(ev.target.closest("[data-close]"))return closeSheet();
    if(ev.target.closest("[data-del]")){delete months[k].txns[t.id];await saveMonths([k]);closeSheet();render();return}
    if(ev.target.closest("[data-save]")){
      t.exclude=$("#exclude").checked;

function contextoIA(){
  const f=figures(), c=salaryCalc(settings.salary), pi=projInputs();
  const L=[];
  const d=new Date();
  L.push(`Hoy es ${d.toLocaleDateString("es-CR",{day:"numeric",month:"long",year:"numeric"})}. Mes en pantalla: ${monthLabel(current)}.`);
  if(settings.name)L.push(`Usuario: ${settings.name}.`);
  L.push(`Moneda base: colones (₡). Tipo de cambio ₡${TC()} por dólar.`);
  L.push("");
  L.push("INGRESOS DEL MES");
  if(Number(settings.salary.gross)>0){
    L.push(`- Salario bruto: ${fCRC.format(c.g)} (${TIPO_ING[settings.salary.tipo]||settings.salary.tipo}, ${FREQ_NOM[settings.salary.freq]||""})`);
    if(settings.salary.tipo==="planilla")L.push(`  CCSS ${fCRC.format(c.ccss)} · renta ${fCRC.format(c.isr)} · otras rebajas ${fCRC.format(c.otros)} → neto ${fCRC.format(c.net)}`);
    if(diasPago(settings.salary).length)L.push(`  Le pagan los días ${diasPago(settings.salary).join(" y ")} de cada mes.`);
  } else L.push("- Sin salario registrado.");
  for(const x of settings.extraIncomes||[])
    L.push(`- ${x.label||"Ingreso"}: ${money(x.monto,x.cur==="usd"?"USD":"CRC")} ${FREQ_NOM[x.freq]||""} (${TIPO_ING[x.tipo]||x.tipo}) = ${fCRC.format(porMes(x.monto,x.freq,x.cur))}/mes`);
  const pg=ingresoALaFecha(current);
  L.push(`INGRESO DEL MES COMPLETO: ${fCRC.format(pg.total)}`);
  L.push(`YA RECIBIDO A HOY: ${fCRC.format(pg.recibido)}${pg.pendiente>0?` · FALTA POR ENTRAR: ${fCRC.format(pg.pendiente)} (${enDias(pg.faltan)})`:" (ya entró todo)"}`);
  L.push("Importante: cuando hables de lo que tiene disponible, usá lo ya recibido, no el mes completo.");
  L.push("");
  L.push(`GASTOS DEL MES: ${fCRC.format(f.spend)} · queda ${fCRC.format(f.queda)}`);
  if(f.cats&&f.cats.length){
    L.push("Por categoría:");
    for(const [k,v] of f.cats)L.push(`- ${CAT[k]?CAT[k].name:k}: ${fCRC.format(v)} (${(v/f.spend*100).toFixed(0)}%)`);
  }
  const horm=totalHormiga(); if(horm>0)L.push(`Gastos hormiga (menos de ${fCRC.format(hormigaMax())} c/u): ${fCRC.format(horm)}`);
  const fijos=recurring();
  if(fijos.length){L.push("");L.push("GASTOS FIJOS DETECTADOS");
    for(const x of fijos.slice(0,10))L.push(`- ${x.name}: ${fCRC.format(x.avg)}/mes`);}
  const hall=hallazgos?hallazgos():[];
  if(hall.length){L.push("");L.push("HALLAZGOS");for(const x of hall)L.push(`- ${x.titulo}: ${fCRC.format(x.monto)}`);}
  if((settings.debts||[]).length){
    L.push("");L.push("DEUDAS");
    for(const x of settings.debts){const dc=debtCalc(x);
      L.push(`- ${x.name||"Deuda"}: saldo ${money(x.balance,x.currency)}, ${x.rate}% anual, cuota ${money(x.payment,x.currency)}${dc.months?`, se cancela en ${dc.months} meses con ${money(dc.interest,x.currency)} de intereses`:""}`);}
  }
  L.push("");
  L.push(`AHORRO: tiene ${fCRC.format(settings.proj.saldo||0)} guardado, rinde ${settings.proj.rate}% anual.`);
  if((settings.goals||[]).length)
    L.push("METAS: "+settings.goals.map(g=>`${metaDe(g.kind).t} ${money(g.monto,g.cur==="usd"?"USD":"CRC")}`).join(" · "));
  const col=colchon(); if(col&&col.meses)L.push(`Fondo de emergencia: alcanza ${col.meses.toFixed(1)} meses.`);
  return L.join("\n");
}
const IA_SISTEMA=`Sos Pacci, el asistente financiero de una app costarricense. Respondés en español de Costa Rica, con voseo, directo y sin rodeos.

Reglas:
- Usá SOLO los datos que te doy. Si algo no está, decilo; nunca inventés un número.
- Montos en colones con el símbolo ₡ y comas de miles.
- Respuestas cortas: dos o tres párrafos como máximo, sin listas largas ni encabezados.
- Sé concreto y accionable. "Gastaste ₡84,000 en restaurantes, 22% de todo el mes" sirve; "deberías controlar tus gastos" no.
- No des consejos de inversión específicos ni recomendés productos financieros. Sos contador, no asesor.
- Si la pregunta no es de finanzas, decilo en una línea y volvé al tema.`;

function preguntasSugeridas(){
  const f=figures(), out=[];
  if(f.spend>0)out.push("¿En qué se me fue la plata este mes?");
  if(totalHormiga()>0)out.push("¿Cómo bajo mis gastos hormiga?");
  if((settings.debts||[]).length)out.push("¿Cuál deuda me conviene pagar primero?");
  if(f.inc>0&&f.queda>0)out.push("¿Cuánto puedo ahorrar sin apretarme?");
  if(recurring().length)out.push("¿Qué gastos fijos podría recortar?");
  out.push("¿Cómo voy comparado con el mes pasado?");
  return out.slice(0,4);
}

async function preguntar(txt){
  txt=(txt||"").trim();if(!txt)return;
  if(!caps.sample){toast("La IA solo funciona abriendo Pacci desde claude.ai.",true);return}
  chat.push({rol:"yo",txt});
  chat.push({rol:"pacci",txt:"",cargando:true});
  pintarChat();
  const inp=$("#chatInput");if(inp){inp.value="";inp.style.height="auto"}
  const i=chat.length-1;
  const historia=chat.slice(0,-1).filter(m=>m.txt).slice(-6)
    .map(m=>({role:m.rol==="yo"?"user":"assistant",content:m.txt}));
  try{
    const r=await caps.sample([
      {role:"user",content:`${IA_SISTEMA}\n\n=== DATOS FINANCIEROS ===\n${contextoIA()}\n=== FIN DE LOS DATOS ===\n\nRespondé la pregunta del usuario usando esos datos.`},
      {role:"assistant",content:"Listo, ya revisé tus números. ¿Qué querés saber?"},
      ...historia.slice(0,-1),
      {role:"user",content:txt}
    ],{modelTier:"default",onText:({text})=>{chat[i]={rol:"pacci",txt};chat[i].txt=text;pintarChat()}});
    chat[i]={rol:"pacci",txt:(r&&r.text)||chat[i].txt||"No pude responder esa."};
  }catch(e){
    chat[i]={rol:"pacci",txt:e&&e.code==="rate_limited"
      ?"Muchas preguntas seguidas. Esperá un momento y volvé a intentar."
      :"No pude responder ahorita. Probá de nuevo."};
  }
  pintarChat();
}

document.addEventListener("input",ev=>{
  const el=ev.target;
  // los campos de monto se reescriben con comas antes de leerlos
  const V=el.dataset.monto?reformatear(el):(Number(el.value)||0);
  if(el.id==="q"){query=el.value;const pos=el.selectionStart;render();const q2=$("#q");if(q2){q2.focus();q2.setSelectionRange(pos,pos)}return}
  if(el.id==="wName"){
    settings.name=el.value;queueSave();
    const av=el.closest(".person")?.querySelector(".av");
    if(av)av.textContent=(el.value.trim().charAt(0)||"·").toUpperCase();
    return;
  }
  if(el.id==="gross"){settings.salary.gross=V;settings.salary.grossPer=V/(FREQ[settings.salary.freq]||1);settings.salary.cur="crc";queueSave();if(!settings.onboarded)return;repaintSalary();return}
  if(el.id==="grossPer"){const s=settings.salary;s.grossPer=V;recalcGross();queueSave();repaintWiz();return}
  if(el.id==="codigo"){
    el.value=el.value.replace(/\D/g,"").slice(0,6);
    if(el.value.length===6)verificarCodigo(el.value);
    return;
  }
  if(el.id==="correo"){authCorreo=el.value;return}
  if(el.id==="chatInput"){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px";return}
  if(el.id==="diaPago"){settings.salary.dia=el.value;queueSave();return}
  if(el.id==="salEtiq"){settings.salary.etiqueta=el.value;queueSave();return}
  if(el.dataset.meta!==undefined){const g=settings.goals[+el.dataset.meta];
    if(g){g.monto=V;syncMetas();queueSave();repaintMetas()}return}
  if(el.dataset.person!==undefined){const p=settings.people[+el.dataset.person];if(p){p.name=el.value;queueSave()}return}
  if(el.dataset.inc!==undefined){
    const x=settings.extraIncomes[+el.dataset.inc];
    if(x){const k=el.dataset.ik;x[k]=k==="monto"?V:el.value;queueSave();if(k==="monto")repaintWiz()}
    return;
  }
  if(el.id==="credits"){settings.salary.credits=V;queueSave();repaintSalary();return}
  if(el.dataset.rate){settings.salary.rates[el.dataset.rate]=Number(el.value)||0;queueSave();repaintSalary();return}
  if(el.dataset.ded!==undefined){
    const i=+el.dataset.ded,k=el.dataset.k, d=settings.salary.custom[i];
    d[k]=k==="value"?(d.type==="pct"?(Number(el.value.replace(",",".")) ||0):V):el.value;
    queueSave();
    if(k!=="name"){repaintSalary();repaintWiz();repaintDed(i)}
    return;
  }
  if(el.id==="fx"){settings.fx=Math.max(1,Number(el.value)||settings.fx);queueSave();return}
  if(["pSaldo","pAporte","pRate","pMeta"].includes(el.id)){
    if(el.id==="pSaldo"&&V>0)settings.hasSav=true;
    if(el.id==="pSaldo"){settings.proj.saldoRaw=V;recalcSaldo();queueSave();repaintProj();return}
    const map={pSaldo:"saldo",pAporte:"aporte",pRate:"rate",pMeta:"meta"};
    settings.proj[map[el.id]]=el.value===""&&el.id==="pAporte"?null:(el.dataset.monto?V:Number(el.value)||0);
    queueSave();repaintProj();return;
  }
});

  const el=$("#tour");if(!el)return;
  if(tour===null||tour>=TOUR.length||!settings.onboarded||tab!=="inicio"){el.hidden=true;el.innerHTML="";return}
  const paso=TOUR[tour], t=document.querySelector(paso.sel);
  if(!t){cerrarTour();return}
  const sc=$("#scroll"), vh=window.innerHeight;
  let r=t.getBoundingClientRect();
  // si el objetivo no se ve entero, acomodamos el scroll y volvemos a medir
  if(r.top<70||r.bottom>vh-120){
    sc.scrollTop+=r.top-Math.max(90,vh*0.22);
    requestAnimationFrame(()=>requestAnimationFrame(pintarTour));

  const pad=10, abajo=r.bottom+210<vh;

  el.innerHTML=`<div class="foco" style="left:${Math.round(r.left-pad)}px;top:${Math.round(r.top-pad)}px;width:${Math.round(r.width+pad*2)}px;height:${Math.round(r.height+pad*2)}px"></div>

  const d=$("#dlg");if(!d.open)return;
  d.classList.add("closing");
  setTimeout(()=>{d.classList.remove("closing");d.close();d.style.transform=""},230);
}
(function dragSheet(){
  const d=$("#dlg");let y0=null,dy=0;
  d.addEventListener("pointerdown",e=>{
    const g=e.target.closest(".grab");if(!g)return;
    y0=e.clientY;dy=0;d.style.transition="none";g.setPointerCapture(e.pointerId);
  });
  d.addEventListener("pointermove",e=>{
    if(y0===null)return;
    dy=Math.max(0,e.clientY-y0);d.style.transform=`translateY(${dy}px)`;
  });
  d.addEventListener("pointerup",()=>{
    if(y0===null)return;
    d.style.transition="transform .25s cubic-bezier(.32,.72,0,1)";
    if(dy>90){d.style.transform="translateY(110%)";setTimeout(()=>{d.close();d.style.transform="";d.style.transition=""},230)}
    else d.style.transform="";
    y0=null;
  });
})();

/* ===== Arranque ===== */
render();
(async()=>{
  // 1) ¿Hay sesión? Si la librería no carga, la app sigue andando en modo local.
  const hayAuth=await initAuth();
  // 2) Capacidades de claude.ai, si estamos adentro
  if(window.claude?.use){
    try{
      const[mcp,sample]=await Promise.all([window.claude.use("mcp"),window.claude.use("sample")]);
      caps.mcp=mcp;caps.sample=sample;
    }catch(e){}
  }
  // 3) Datos
  await initStore();
  const ks=Object.keys(months).sort();
  if(ks.length&&!months[current])current=ks[ks.length-1];
  arrancando=false;
  render();
  if(hayAuth&&sesion===false)return;            // la pantalla de entrada se basta sola
  if(!window.claude?.use)toast("Abrí esta app desde claude.ai o la app de Claude para conectar Gmail.",true);
  else if(!caps.mcp)toast("Esta vista no puede leer Gmail. Abrila desde claude.ai o la app de Claude.",true);
})();
})();
</script>
